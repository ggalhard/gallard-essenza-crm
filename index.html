<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno Gallard</title>
<meta name="description" content="CRM offline da Gallard Essenza — clientes, pedidos, follow-up, estoque e financeiro. Instalável, roda sem internet depois de aberto.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141C25" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gallard">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ============================================================
   TOKENS — azul sutil (2026-09-21). Até aqui o caderno usava os
   dois registros da marca Gallard (creme+dourado / preto+dourado) e
   as fontes serifadas dela. A pedido da cliente virou ferramenta de
   trabalho, não peça de marca: fundo claro e calmo, um azul
   acinzentado só pra ação, e fonte do sistema — que carrega na hora
   e não confunde "1" com "I" nem "0" com "O" (problema real da
   Cormorant nos números, ver histórico).
   ============================================================ */
:root{
  --surface:#F2F5F9;
  --surface-card:#FFFFFF;
  --surface-card-2:#EBF0F6;
  --field-bg:#FFFFFF;
  --seg-on:#FFFFFF;
  --ink:#1C2A39;
  --ink-soft:#526277;
  --ink-faint:#7A889A;
  --accent:#3B6B9E;
  --accent-strong:#2F5883;
  --accent-soft:#E4EDF7;
  --on-accent:#FFFFFF;
  --border:#DCE3EC;
  --bar-bg:#FFFFFF;
  --bar-ink:#1C2A39;
  --ok:#256B4C;
  --ok-bg:#E1F1E8;
  --warn:#8A530A;
  --warn-bg:#FAEFD9;
  --critical:#B03D37;
  --critical-bg:#FAE5E3;
  --toast-bg:#1C2A39;
  --toast-ink:#FFFFFF;
  --toast-acao:#A9C8EC;
  --overlay:rgba(20,32,46,.42);
  --shadow:0 1px 2px rgba(28,42,57,.05);
  --shadow-lift:0 6px 18px rgba(28,42,57,.2);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#0F151C;
    --surface-card:#18212B;
    --surface-card-2:#212C38;
    --field-bg:#0F151C;
    --seg-on:#2E3C4D;
    --ink:#E3E9F0;
    --ink-soft:#A5B2C1;
    --ink-faint:#7C8A9B;
    --accent:#86ACD8;
    --accent-strong:#A3C0E3;
    --accent-soft:#1E2E42;
    --on-accent:#0F151C;
    --border:#2B3847;
    --bar-bg:#141C25;
    --bar-ink:#E3E9F0;
    --ok:#72C59C;
    --ok-bg:#16291F;
    --warn:#E2AE5E;
    --warn-bg:#2F2413;
    --critical:#F08E86;
    --critical-bg:#351B1B;
    --toast-bg:#E3E9F0;
    --toast-ink:#0F151C;
    --toast-acao:#2F5883;
    --overlay:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-lift:0 6px 18px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --surface:#0F151C;
  --surface-card:#18212B;
  --surface-card-2:#212C38;
  --field-bg:#0F151C;
  --seg-on:#2E3C4D;
  --ink:#E3E9F0;
  --ink-soft:#A5B2C1;
  --ink-faint:#7C8A9B;
  --accent:#86ACD8;
  --accent-strong:#A3C0E3;
  --accent-soft:#1E2E42;
  --on-accent:#0F151C;
  --border:#2B3847;
  --bar-bg:#141C25;
  --bar-ink:#E3E9F0;
  --ok:#72C59C;
  --ok-bg:#16291F;
  --warn:#E2AE5E;
  --warn-bg:#2F2413;
  --critical:#F08E86;
  --critical-bg:#351B1B;
  --toast-bg:#E3E9F0;
  --toast-ink:#0F151C;
  --toast-acao:#2F5883;
  --overlay:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lift:0 6px 18px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface);
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

.brand{font-weight:700;text-transform:uppercase;letter-spacing:.16em}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app-shell{
  display:flex;flex-direction:column;min-height:100vh;max-width:560px;margin:0 auto;
  background:var(--surface);
}
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--bar-bg);color:var(--bar-ink);
  padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;
  display:flex;flex-direction:column;gap:1px;
  border-bottom:1px solid var(--border);
}
.topbar .wordmark{font-size:11px;color:var(--accent)}
.topbar .screen-title{font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--bar-ink)}
.topbar .screen-sub{font-size:13px;color:var(--ink-soft)}

.content{flex:1;padding:16px 16px 120px;overflow-y:auto}

.tabbar{
  position:sticky;bottom:0;z-index:20;
  display:flex;background:var(--bar-bg);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0);
}
.tabbtn{
  flex:1;background:none;border:none;padding:7px 2px 7px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--ink-soft);font-size:11px;font-weight:500;
}
.tabbtn .ic-wrap{display:flex;align-items:center;justify-content:center;width:54px;height:28px;border-radius:99px;transition:background .15s ease}
.tabbtn .ic{width:22px;height:22px;display:block}
.tabbtn[aria-current="true"]{color:var(--accent);font-weight:700}
.tabbtn[aria-current="true"] .ic-wrap{background:var(--accent-soft)}

/* ---------- títulos de seção ---------- */
.section-label{
  font-size:14px;font-weight:700;color:var(--ink);
  margin:24px 2px 10px;
}
.section-label:first-child{margin-top:4px}
.section-label .extra{font-weight:500;color:var(--ink-soft)}

/* navegador de mês do Financeiro */
.mesnav{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:6px;margin-bottom:12px;
}
.mesnav button{
  flex:0 0 auto;width:40px;height:40px;border:0;border-radius:10px;
  background:var(--surface-card-2);color:var(--ink);font-size:20px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.mesnav button:disabled{opacity:.3;cursor:default}
.mesnav .rotulo{flex:1;text-align:center;font-weight:700;font-size:15px}
.mesnav .rotulo small{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-top:1px}

/* linha de categoria com barra proporcional */
.catrow{margin:0 2px 12px}
.catrow .topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.catrow .nome{color:var(--ink)}
.catrow .val{font-weight:700}
.catrow .trilho{height:6px;border-radius:99px;background:var(--surface-card-2);margin-top:6px;overflow:hidden}
.catrow .barra{height:100%;border-radius:99px}

/* ---------- números de resumo ---------- */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{
  background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);
}
button.kpi{width:100%;text-align:left;cursor:pointer;font-size:inherit}
.kpi .v{font-weight:700;font-size:clamp(17px,5.4vw,22px);line-height:1.15;letter-spacing:-.01em;color:var(--ink)}
.kpi .l{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.35}

/* três faixas lado a lado (total / mês / semana) — mais compacto que o
   kpi-grid, que é pensado pra 1 ou 2 números grandes */
.faixas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.faixas .fx{background:var(--surface-card);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center}
.faixas .fx .v{font-weight:700;font-size:14px;color:var(--ink);letter-spacing:-.01em}
.faixas .fx .l{font-size:10.5px;color:var(--ink-soft);margin-top:3px;line-height:1.25}

.alert-card{
  display:flex;align-items:center;gap:12px;
  background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px;cursor:pointer;width:100%;text-align:left;
}
.alert-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.alert-card .t1{font-size:15px;font-weight:600}
.alert-card .t2{font-size:13px;color:var(--ink-soft);margin-top:1px}
.alert-card .chev,.alert-card > svg{margin-left:auto;color:var(--ink-faint);flex:0 0 auto}

/* ---------- cartões ---------- */
.card{
  background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;width:100%;text-align:left;
  display:block;font-size:inherit;
}
.card-row{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.card-title{font-size:16px;font-weight:600;color:var(--ink)}
.card-sub{font-size:13px;color:var(--ink-soft);margin-top:2px}
.card-meta{font-size:12.5px;color:var(--ink-soft);margin-top:8px;display:flex;gap:4px 12px;flex-wrap:wrap}
.card-right{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.card-value{font-size:16px;font-weight:700}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:11.5px;font-weight:700;white-space:nowrap;
}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.critical{background:var(--critical-bg);color:var(--critical)}
.badge.neutral{background:var(--surface-card-2);color:var(--ink-soft)}

.empty{text-align:center;padding:44px 20px;color:var(--ink-soft)}
.empty .big{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:6px}
.empty .small{font-size:14px;line-height:1.5}

.searchbar{
  display:flex;align-items:center;gap:8px;background:var(--surface-card);
  border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;
}
.searchbar:focus-within{border-color:var(--accent)}
.searchbar input{flex:1;background:none;border:none;outline:none;font-size:16px;color:var(--ink)}
.searchbar input::placeholder{color:var(--ink-faint)}
.searchbar svg{color:var(--ink-faint);flex:0 0 auto}

.chiprow{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:99px;border:1px solid var(--border);
  background:var(--surface-card);font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
}
.chip .n{opacity:.75;margin-left:3px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}

/* escolha entre 2 ou 3 opções lado a lado (frequência, forma de pagar) —
   mais rápido de entender que um <select> fechado */
.seg{display:flex;background:var(--surface-card-2);border-radius:11px;padding:3px;gap:3px}
.seg button{
  flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;cursor:pointer;
  font-size:14px;font-weight:500;color:var(--ink-soft);
}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--accent);font-weight:700;box-shadow:0 1px 3px rgba(28,42,57,.12)}

.cal-semana,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-semana{margin-bottom:4px}
.cal-semana .cab{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700}
.cal-cel{
  aspect-ratio:1;border:1px solid var(--border);border-radius:10px;background:var(--surface-card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;color:var(--ink);font-size:13px;
}
.cal-cel.vazio{background:none;border-color:transparent;cursor:default}
.cal-cel.hoje{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-cel.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cal-cel .dot{width:5px;height:5px;border-radius:50%}
.cal-legenda{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 4px;font-size:12px;color:var(--ink-soft)}
.cal-legenda span{display:inline-flex;align-items:center;gap:5px}
.cal-legenda .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* botão de adicionar com o nome do que adiciona — "+ Pedido" diz mais
   que um "+" sozinho */
.fab{
  position:fixed;z-index:25;right:max(16px, calc(50% - 280px + 16px));
  bottom:calc(78px + env(safe-area-inset-bottom,0px));
  height:52px;padding:0 20px 0 15px;border-radius:99px;border:none;cursor:pointer;
  background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-lift);
  display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;
}
.fab svg{width:22px;height:22px}

/* ---------- modal / sheet ---------- */
.overlay{
  position:fixed;inset:0;z-index:40;background:var(--overlay);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:var(--surface-card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 14px}
.sheet-title{font-size:20px;font-weight:700;margin-bottom:16px;letter-spacing:-.01em}

.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field label .opc{font-weight:400;color:var(--ink-soft)}
.field input,.field select,.field textarea{
  width:100%;background:var(--field-bg);border:1px solid var(--border);border-radius:10px;
  padding:11px 12px;font-size:16px;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field input[readonly]{background:var(--surface-card-2)}
.field textarea{resize:vertical;min-height:64px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--ink-soft);margin-top:6px;margin-bottom:12px;line-height:1.45}
.computed{background:var(--surface-card-2);border-radius:10px;padding:11px 12px;font-size:16px;font-weight:700}

.btnrow{display:flex;gap:10px;margin-top:18px}
.btn{
  flex:1;padding:13px 16px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;
  text-align:center;
}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface-card-2);color:var(--ink)}
.btn.outline{background:var(--surface-card);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.danger{background:var(--critical-bg);color:var(--critical)}
.btn.small{flex:none;padding:8px 14px;font-size:13.5px;border-radius:10px}
.btn:active{filter:brightness(.94)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.detail-actions{display:flex;gap:10px;margin:14px 0 2px}

.toast{
  position:fixed;left:50%;bottom:calc(144px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--toast-bg);color:var(--toast-ink);padding:11px 18px;border-radius:12px;
  font-size:14px;box-shadow:var(--shadow-lift);
  display:flex;align-items:center;gap:12px;width:max-content;max-width:calc(100% - 32px);
  opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
}
.toast.com-acao{padding:6px 8px 6px 18px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.toast.show.com-acao{pointer-events:auto}
.toast .toast-acao{
  background:none;border:0;color:var(--toast-acao);font-weight:800;font-size:14px;
  padding:8px 10px;cursor:pointer;white-space:nowrap;
}

.menu-item{
  display:flex;align-items:center;gap:12px;background:var(--surface-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:15px 14px;margin-bottom:10px;box-shadow:var(--shadow);
  cursor:pointer;width:100%;text-align:left;
}
.menu-item .mi-title{font-size:15.5px;font-weight:600}
.menu-item .mi-sub{font-size:13px;color:var(--ink-soft);margin-top:1px}
.menu-item .chev{margin-left:auto;color:var(--ink-faint)}

.stepper{display:flex;align-items:center;gap:8px}
.stepper button{
  flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-card-2);
  font-size:19px;line-height:1;cursor:pointer;color:var(--ink);
}
.stepper .qty{min-width:36px;text-align:center;font-weight:700;font-size:16px}
.stepper .un{font-size:13px;color:var(--ink-soft)}
.field .stepper input{flex:1;min-width:0;text-align:center;font-weight:700;padding:9px 4px}

.divider-orn{height:1px;background:var(--border);margin:20px 0 4px}

.backup-summary{
  background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);padding:8px 16px;margin-bottom:16px;
}
.backup-summary .row{display:flex;justify-content:space-between;padding:9px 0;font-size:14px;border-bottom:1px solid var(--border)}
.backup-summary .row:last-child{border-bottom:none}

/* ---------- ficha do cliente ---------- */
.saldo-card{
  background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);
}
.saldo-card .rotulo{font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.saldo-card .valor{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.saldo-card .rodape{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin-top:8px}
.saldo-card .rodape b{color:var(--ink);font-weight:600}

/* uma conta (em aberto ou já recebida): o que é e quando, valor, ação */
.conta{
  display:flex;align-items:center;gap:10px;background:var(--surface-card);border:1px solid var(--border);
  border-radius:12px;padding:10px 10px 10px 12px;margin-bottom:8px;
}
.conta .info{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:inherit}
.conta .o-que{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conta .quando{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.conta .quando.atrasado{color:var(--critical);font-weight:600}
.conta .val{font-weight:700;font-size:15px;white-space:nowrap}
.conta .acoes{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.conta .acoes .btn{width:100%}

/* prévia do parcelamento: cada parcela com data e valor, antes de salvar */
.previa{background:var(--surface-card-2);border-radius:12px;padding:12px 14px;margin:2px 0 12px}
.previa .resumo{font-weight:700;font-size:15px}
.previa ol{list-style:none;margin:8px 0 0;padding:0}
.previa li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-top:1px solid var(--border)}
.previa li span:first-child{color:var(--ink-soft)}
.previa li span:last-child{font-weight:600}
</style>
</head>
<body>

<div id="app-shell">
  <div class="topbar">
    <div class="wordmark brand">Gallard Essenza</div>
    <div class="screen-title" id="screen-title">Início</div>
    <div class="screen-sub" id="screen-sub"></div>
  </div>
  <div class="content" id="content"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DADOS — tudo fica só nesse aparelho (localStorage). Sem
   chamada de rede em runtime nenhuma: depois que a página carrega
   uma vez, continua funcionando se a internet cair no meio do uso.
   ============================================================ */
const DB_KEY = "gallard-crm-db-v1";
const SCHEMA = 4;
const EMPTY_DB = { schema: SCHEMA, clientes: [], pedidos: [], followups: [], estoque: [], financeiro: [] };

/* Compara texto ignorando acento e caixa — "mascara reconstrucao" e
   "Máscara Reconstrução" viram a mesma coisa. Usado só na migração,
   pra reaproveitar o que foi digitado à mão antes do vínculo existir. */
function normalizar(s){
  return (s??"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}

/* Sobe o banco antigo (schema 1) pro novo sem perder nada:
   - cliente.bairro vira cliente.rua
   - pedido.produto (texto livre) tenta achar o produto no estoque pelo nome;
     se achar, vira pedido.produtoId. Se não achar, o texto continua lá e o
     pedido aparece marcado como "produto fora do estoque" na tela.
   - marca os pedidos já entregues como estoqueBaixado, senão a primeira
     reconciliação devolveria quantidade que nunca saiu. */
function migrar(dbv){
  const de = Number(dbv.schema)||1;
  if(de >= SCHEMA) return dbv;

  if(de < 2){
    (dbv.clientes||[]).forEach(c=>{ if(c.bairro !== undefined){ if(!c.rua) c.rua=c.bairro; delete c.bairro; } });
    (dbv.pedidos||[]).forEach(p=>{
      if(!p.produtoId && p.produto){ const e=(dbv.estoque||[]).find(x=>normalizar(x.produto)===normalizar(p.produto)); if(e) p.produtoId=e.id; }
      if(p.custoUnit===undefined){ const e=(dbv.estoque||[]).find(x=>x.id===p.produtoId); p.custoUnit=e?(Number(e.custoUnit)||0):0; }
      if(p.estoqueBaixado===undefined){ p.estoqueBaixado=false; p.qtdBaixada=0; }
    });
    (dbv.financeiro||[]).forEach(f=>{ if(f.estoqueId===undefined){ f.estoqueId=null; f.qtdEntrada=0; } });
  }
  if(de < 3){
    (dbv.financeiro||[]).forEach(f=>{ if(f.liquidado===undefined){ f.liquidado=true; f.liquidadoEm=f.data; f.vencimento=null; } });
  }
  // schema 3 -> 4: pedidos e compras podem ter vários itens. Os campos
  // antigos ficam no backup, mas são convertidos sem mudar nenhum valor.
  (dbv.pedidos||[]).forEach(p=>{
    if(!Array.isArray(p.itens)) p.itens=[{produtoId:p.produtoId||null, produto:p.produto||"", custoUnit:Number(p.custoUnit)||0, qtd:Number(p.qtd)||0, valorUnit:Number(p.valorUnit)||0}];
  });
  (dbv.financeiro||[]).forEach(f=>{
    if(!Array.isArray(f.itensEstoque)) f.itensEstoque=f.estoqueId&&Number(f.qtdEntrada)>0?[{produtoId:f.estoqueId,qtd:Number(f.qtdEntrada)||0,custoUnit:Number(f.custoUnit)||0}]:[];
  });

  dbv.schema = SCHEMA;
  return dbv;
}

/* As categorias e a unidade do Estoque mudaram (2026-09-17): categoria
   passou de Hidratação/Nutrição/Reconstrução/Finalização/Outro pra
   Tratamento/Finalizadores/Alinhamento, e unidade virou só "Unidades".
   Sem isso, abrir e salvar um produto antigo sem mexer no campo
   reclassificava ele sozinho, porque o <select> não tem mais a opção
   antiga marcada. Roda em todo load — idempotente, não mexe em quem já
   está no valor novo. */
function normalizarEstoque(dbv){
  const mapaCategoria = {"Hidratação":"Tratamento","Nutrição":"Tratamento","Reconstrução":"Tratamento","Finalização":"Finalizadores","Outro":"Tratamento"};
  (dbv.estoque||[]).forEach(e=>{
    if(mapaCategoria[e.categoria]) e.categoria = mapaCategoria[e.categoria];
    if(e.unidade !== "Unidades") e.unidade = "Unidades";
  });
  return dbv;
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return structuredClone(EMPTY_DB);
    const parsed = JSON.parse(raw);
    const merged = Object.assign(structuredClone(EMPTY_DB), parsed);
    // o EMPTY_DB já vem com schema atual; se o banco salvo não tem a chave,
    // o merge herdaria a versão nova e a migração seria pulada. Banco sem
    // `schema` é, por definição, o formato 1.
    merged.schema = Number(parsed.schema) || 1;
    return normalizarEstoque(migrar(merged));
  }catch(e){ return structuredClone(EMPTY_DB); }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
let db = loadDB();

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* new Date().toISOString() devolve a data em UTC — no Brasil (UTC-3),
   entre 21h e meia-noite locais isso já é "amanhã", e todo pedido ou
   lançamento feito nesse intervalo saía com a data errada. Os getters
   locais (getFullYear/getMonth/getDate) não têm esse problema. */
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function fmtDate(iso){
  if(!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function fmtMoney(v){
  const n = Number(v)||0;
  return n.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
}
function daysSince(iso){
  if(!iso) return null;
  const a = new Date(iso+"T00:00:00");
  const b = new Date(todayISO()+"T00:00:00");
  return Math.round((b-a)/86400000);
}
function getCliente(id){ return db.clientes.find(c=>c.id===id); }
/* Mesmo mecanismo do deslocaMes, mas em dias — parte sempre de uma data
   já em ISO local (meia-noite), então somar horas nunca cruza a virada
   de dia em UTC (o Brasil está atrás, não na frente). */
function deslocaData(iso, dias){
  const d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+dias);
  return d.toISOString().slice(0,10);
}
/* Segunda a domingo da semana de hoje — é a janela que decide o que
   aparece no topo do Financeiro (ver blocoEmAberto). Fora dela, só na
   ficha do cliente. */
function semanaAtual(){
  const hoje = todayISO();
  const dow = new Date(hoje+"T00:00:00").getDay(); // 0=domingo..6=sábado
  const inicio = deslocaData(hoje, dow===0 ? -6 : -(dow-1));
  return {inicio, fim: deslocaData(inicio, 6)};
}
function estaNaSemana(iso, semana){ return !!iso && iso>=semana.inicio && iso<=semana.fim; }
function getProduto(id){ return db.estoque.find(e=>e.id===id); }
/* "2 disponíveis", não "2 Unidades disponível" — a unidade é sempre
   unidade desde 17/09, repetir ela só atrapalhava a leitura. */
function disponiveis(n){ return `${n} disponíve${Math.abs(n)===1?"l":"is"}`; }
function pedidoItens(p){ return Array.isArray(p.itens) ? p.itens : [{produtoId:p.produtoId,produto:p.produto,custoUnit:p.custoUnit,qtd:p.qtd,valorUnit:p.valorUnit}]; }
/* Soma dos itens, sem desconto — é sobre esse valor que o desconto do
   pedido é calculado (em R$ direto, ou em % convertido na hora de
   salvar — ver openPedidoForm). */
function pedidoSubtotal(p){ return pedidoItens(p).reduce((s,i)=>s+(Number(i.qtd)||0)*(Number(i.valorUnit)||0),0); }
/* Valor de verdade cobrado do cliente — todo o resto do app (Financeiro,
   parcelas, KPIs, dashboard) lê daqui, então o desconto propaga sozinho
   sem precisar mexer em cada lugar que soma pedido. Nunca fica negativo:
   desconto maior que o subtotal é travado no próprio subtotal. */
function pedidoTotal(p){ return Math.max(0, pedidoSubtotal(p) - (Number(p.desconto)||0)); }
function pedidoCusto(p){ return pedidoItens(p).reduce((s,i)=>s+(Number(i.qtd)||0)*(Number(i.custoUnit)||0),0); }
function pedidoResumoProdutos(p){ return pedidoItens(p).map(i=>`${i.produto||"Produto sem vínculo"} × ${Number(i.qtd)||0}`).join(", "); }
function itensCompra(f){ return Array.isArray(f.itensEstoque) ? f.itensEstoque : (f.estoqueId&&f.qtdEntrada?[{produtoId:f.estoqueId,qtd:f.qtdEntrada,custoUnit:f.custoUnit}]:[]); }
/* De quem é esse lançamento. Os lançamentos de pedido mais antigos não
   guardavam clienteId — nesses, o cliente vem do pedido. */
function clienteIdDe(f){
  if(f.clienteId) return f.clienteId;
  const p = f.pedidoId ? db.pedidos.find(x=>x.id===f.pedidoId) : null;
  return p ? p.clienteId : null;
}
/* O que é essa conta, em poucas palavras e sem o nome do cliente — a
   descrição guarda "o quê — quem", e aqui só interessa o "o quê". */
function rotuloConta(f){
  const base = (f.descricao||"").split(" — ")[0].trim() || f.categoria || "Conta";
  return f.parcelamentoId ? `${base} · parcela ${f.parcelaNumero}/${f.totalParcelas}` : base;
}

/* ============================================================
   PARCELAS — uma calculadora só, usada no pedido "Parcelado
   personalizado", no débito da ficha do cliente e no Financeiro.

   Você escolhe QUANTAS parcelas e a frequência; o app divide o valor
   em centavos. Até 21/09 ele pedia o valor de cada parcela, e R$ 100
   em "3x de 33" virava 4 parcelas (33 + 33 + 33 + 1).
   ============================================================ */
const FREQUENCIAS = {
  semanal:   {rotulo:"Semanal",  curto:"semanal"},
  quinzenal: {rotulo:"15 dias",  curto:"a cada 15 dias"},
  mensal:    {rotulo:"Mensal",   curto:"mensal"},
};
/* Planos gravados antes de existir "mensal" guardavam o intervalo em
   dias (7 ou 15) — é assim que eles se traduzem pra frequência. */
function freqLegada(intervalo){ return Number(intervalo)===15 ? "quinzenal" : "semanal"; }

function isoLocal(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

/* Data da parcela n (0 = a primeira). Mensal anda pelo calendário, não
   de 30 em 30 dias: dia 10 cai sempre no dia 10, e dia 31 cai no último
   dia dos meses mais curtos (31/01 → 28/02 → 31/03) sem escorregar. */
function vencimentoParcela(primeiro, freq, n){
  const [a,m,d] = primeiro.split("-").map(Number);
  if(freq==="mensal"){
    const ultimoDia = new Date(a, m+n, 0).getDate();
    return isoLocal(new Date(a, m-1+n, Math.min(d, ultimoDia)));
  }
  return isoLocal(new Date(a, m-1, d + n*(freq==="quinzenal"?15:7)));
}

/* Divide sem perder centavo: todas as parcelas levam o valor
   arredondado pra baixo e os centavos que sobram vão, um por parcela,
   pras últimas. R$ 100 em 3x = 33,33 + 33,33 + 33,34. */
function dividirEmParcelas(total, qtd){
  const centavos = Math.round((Number(total)||0)*100);
  const n = Math.max(1, Math.floor(Number(qtd)||1));
  const base = Math.floor(centavos/n), sobra = centavos - base*n;
  return Array.from({length:n}, (_,i)=> (base + (i >= n-sobra ? 1 : 0))/100);
}
function montarPlano(total, qtd, freq, primeiro){
  return dividirEmParcelas(total, qtd).map((valor,i)=>({numero:i+1, valor, vencimento:vencimentoParcela(primeiro, freq, i)}));
}
/* "3x de R$ 25,00" quando todas são iguais; "3x: 2 de R$ 33,33 e 1 de
   R$ 33,34" quando sobra centavo. */
function resumoPlano(plano){
  const grupos = [];
  plano.forEach(p=>{ const g = grupos.find(x=>x.valor===p.valor); if(g) g.n++; else grupos.push({valor:p.valor, n:1}); });
  if(grupos.length===1) return `${plano.length}x de ${fmtMoney(grupos[0].valor)}`;
  return `${plano.length}x: ` + grupos.map(g=>`${g.n} de ${fmtMoney(g.valor)}`).join(" e ");
}

/* Grava um plano como contas a receber do cliente, uma por parcela. */
function lancarParcelas({clienteId, total, qtd, freq, primeiro, descricao, categoria}){
  const planoId = uid();
  const plano = montarPlano(total, qtd, freq, primeiro);
  plano.forEach(x=> db.financeiro.push({
    id: uid(), data: x.vencimento, tipo:"Entrada", categoria, descricao, valor: x.valor,
    formaPagamento:"", pedidoId:null, clienteId, obs:"",
    parcelamentoId: planoId, parcelaNumero: x.numero, totalParcelas: plano.length,
    frequencia: FREQUENCIAS[freq].curto,
    estoqueId:null, qtdEntrada:0, itensEstoque:[],
    liquidado:false, liquidadoEm:null, vencimento: x.vencimento,
  }));
  return plano;
}

/* Campos da calculadora. `p` é o prefixo dos ids, pra caber mais de uma
   no mesmo formulário sem colidir. */
function camposParcelasHTML(p, v){
  const freq = FREQUENCIAS[v.freq] ? v.freq : "semanal";
  return `
    <div class="field-row">
      <div class="field"><label for="${p}-qtd">Nº de parcelas</label>
        <div class="stepper">
          <button type="button" id="${p}-menos" aria-label="Uma parcela a menos">−</button>
          <input id="${p}-qtd" type="number" inputmode="numeric" min="1" max="60" value="${Number(v.qtd)||2}">
          <button type="button" id="${p}-mais" aria-label="Uma parcela a mais">+</button>
        </div>
      </div>
      <div class="field"><label for="${p}-venc">1º vencimento</label><input id="${p}-venc" type="date" value="${v.primeiro||""}"></div>
    </div>
    <div class="field"><label>Frequência</label>
      <div class="seg" id="${p}-freq" role="group" aria-label="Frequência das parcelas">${Object.entries(FREQUENCIAS).map(([id,f])=>`<button type="button" data-freq="${id}" aria-pressed="${freq===id}">${f.rotulo}</button>`).join("")}</div>
    </div>
    <div class="previa" id="${p}-previa" aria-live="polite"></div>
  `;
}

/* Liga a calculadora: − e +, frequência, data e a prévia ao vivo.
   `lerTotal` devolve o valor a dividir na hora (no pedido ele muda com
   itens e desconto). `dataBase` sugere o 1º vencimento — um período
   depois dela — enquanto você não escolher uma data à mão. */
function ligarParcelas(root, p, lerTotal, dataBase){
  const qtdEl = root.querySelector(`#${p}-qtd`), vencEl = root.querySelector(`#${p}-venc`),
        segEl = root.querySelector(`#${p}-freq`), previaEl = root.querySelector(`#${p}-previa`);
  let freq = (segEl.querySelector('[aria-pressed="true"]')||{dataset:{freq:"semanal"}}).dataset.freq;
  let dataEscolhida = !!vencEl.value;
  const qtd = ()=> Math.min(60, Math.max(1, Math.floor(Number(qtdEl.value)||1)));
  function sugerirData(){
    if(!dataEscolhida && dataBase) vencEl.value = vencimentoParcela(dataBase(), freq, 1);
  }
  function atualizar(){
    const total = Math.round((Number(lerTotal())||0)*100)/100;
    if(!(total>0)){ previaEl.innerHTML = `<div class="hint" style="margin:0">Informe o valor pra ver as parcelas.</div>`; return; }
    if(!vencEl.value){ previaEl.innerHTML = `<div class="hint" style="margin:0">Escolha a data do 1º vencimento.</div>`; return; }
    const plano = montarPlano(total, qtd(), freq, vencEl.value);
    const linhas = plano.length>8 ? [...plano.slice(0,6), null, plano[plano.length-1]] : plano;
    previaEl.innerHTML = `
      <div class="resumo tnum">${resumoPlano(plano)}</div>
      <div class="hint" style="margin:2px 0 0">Total ${fmtMoney(total)} · ${FREQUENCIAS[freq].curto}</div>
      <ol>${linhas.map(x=> x
        ? `<li><span>${x.numero}ª parcela · ${fmtDate(x.vencimento)}</span><span class="tnum">${fmtMoney(x.valor)}</span></li>`
        : `<li><span>…</span><span></span></li>`).join("")}</ol>`;
  }
  root.querySelector(`#${p}-menos`).addEventListener("click", ()=>{ qtdEl.value = Math.max(1, qtd()-1); atualizar(); });
  root.querySelector(`#${p}-mais`).addEventListener("click", ()=>{ qtdEl.value = Math.min(60, qtd()+1); atualizar(); });
  qtdEl.addEventListener("input", atualizar);
  ["input","change"].forEach(ev=> vencEl.addEventListener(ev, ()=>{ dataEscolhida = !!vencEl.value; atualizar(); }));
  segEl.querySelectorAll("[data-freq]").forEach(b=> b.addEventListener("click", ()=>{
    freq = b.dataset.freq;
    segEl.querySelectorAll("[data-freq]").forEach(x=> x.setAttribute("aria-pressed", String(x===b)));
    sugerirData(); atualizar();
  }));
  sugerirData(); atualizar();
  return { ler: ()=>({qtd:qtd(), freq, primeiro:vencEl.value}), atualizar, sugerirData };
}

/* ============================================================
   DÉBITO DO CLIENTE — sem venda: dívida antiga, produto levado sem
   pedido, acerto combinado. Entra direto em "a receber" vinculado ao
   cliente, de uma vez (com ou sem data combinada) ou parcelado. Não
   mexe no Estoque. Usado pela ficha do cliente e pelo Financeiro.
   ============================================================ */
function camposDebitoHTML(clienteId, clienteFixo){
  return `
    ${clienteFixo ? "" : `<div class="field"><label for="d-cli">Cliente</label><select id="d-cli">${clienteOptions(clienteId)}</select></div>`}
    <div class="field-row">
      <div class="field"><label for="d-valor">Valor (R$)</label><input id="d-valor" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00"></div>
      <div class="field"><label for="d-data">Data do débito</label><input id="d-data" type="date" value="${todayISO()}"></div>
    </div>
    <div class="field"><label for="d-desc">Do que é <span class="opc">(opcional)</span></label><input id="d-desc" placeholder="Ex: dívida antiga, produto levado sem pedido"></div>
    <div class="field"><label>Como vai pagar</label>
      <div class="seg" role="group" aria-label="Como vai pagar">
        <button type="button" data-modo="unico" aria-pressed="true">De uma vez</button>
        <button type="button" data-modo="parcelado" aria-pressed="false">Parcelado</button>
      </div>
    </div>
    <div id="d-unico"><div class="field"><label for="d-venc">Combinado pra <span class="opc">(opcional)</span></label><input id="d-venc" type="date"></div></div>
    <div id="d-parcelado" style="display:none">${camposParcelasHTML("dp", {qtd:2, freq:"semanal"})}</div>
    <p class="hint">Entra em "a receber" na ficha do cliente e só vai pro caixa quando você tocar em <b>Recebi</b>. Não mexe no estoque.</p>
  `;
}
/* Devolve {salvar}; salvar() grava e devolve {msg, ym}, ou null se
   faltou algo (e já avisou o quê). */
function ligarDebito(root, clienteFixoId){
  let modo = "unico";
  const valorEl = root.querySelector("#d-valor"), dataEl = root.querySelector("#d-data");
  const parcelas = ligarParcelas(root, "dp", ()=>valorEl.value, ()=>dataEl.value||todayISO());
  valorEl.addEventListener("input", parcelas.atualizar);
  dataEl.addEventListener("change", ()=>{ parcelas.sugerirData(); parcelas.atualizar(); });
  root.querySelectorAll("[data-modo]").forEach(b=> b.addEventListener("click", ()=>{
    modo = b.dataset.modo;
    root.querySelectorAll("[data-modo]").forEach(x=> x.setAttribute("aria-pressed", String(x===b)));
    root.querySelector("#d-unico").style.display = modo==="unico" ? "block" : "none";
    root.querySelector("#d-parcelado").style.display = modo==="parcelado" ? "block" : "none";
    parcelas.atualizar();
  }));
  function salvar(){
    const clienteId = clienteFixoId || root.querySelector("#d-cli").value;
    const cli = getCliente(clienteId);
    const valor = Math.round((Number(valorEl.value)||0)*100)/100;
    const data = dataEl.value || todayISO();
    const oque = root.querySelector("#d-desc").value.trim() || "Débito";
    if(!cli){ alert("Escolha o cliente."); return null; }
    if(valor<=0){ alert("Informe o valor do débito."); return null; }
    const descricao = `${oque} — ${cli.nome}`;
    if(modo==="parcelado"){
      const {qtd, freq, primeiro} = parcelas.ler();
      if(!primeiro){ alert("Escolha a data do 1º vencimento."); return null; }
      const plano = lancarParcelas({clienteId, total:valor, qtd, freq, primeiro, descricao, categoria:"Débito de cliente"});
      return {msg:`Débito lançado em ${resumoPlano(plano)}`, ym:primeiro.slice(0,7)};
    }
    db.financeiro.push({
      id:uid(), data, tipo:"Entrada", categoria:"Débito de cliente", descricao, valor,
      formaPagamento:"", pedidoId:null, clienteId, obs:"",
      estoqueId:null, qtdEntrada:0, itensEstoque:[],
      liquidado:false, liquidadoEm:null, vencimento: root.querySelector("#d-venc").value || null,
    });
    return {msg:`Débito de ${fmtMoney(valor)} adicionado`, ym:data.slice(0,7)};
  }
  return {salvar};
}

/* ============================================================
   ESTOQUE — o vínculo que faltava entre venda, estoque e caixa.

   Regra: a quantidade em `estoque.qtd` é o que existe FISICAMENTE na
   prateleira. Ela só muda em três situações, todas reconciliadas aqui:

   1. pedido vira "Entregue"  → sai do estoque (produto foi entregue)
   2. lançamento de "Compra de estoque" no Financeiro → entra no estoque
   3. ajuste manual pelos botões +/− da tela de Estoque

   Pedido "Pendente" NÃO baixa estoque — ele fica *comprometido*: já foi
   prometido a alguém, mas ainda não saiu. Por isso existe `disponivel()`,
   que é o que realmente dá pra vender sem furar promessa.
   ============================================================ */

/* Quanto de um produto está prometido em pedidos ainda não entregues. */
function comprometido(produtoId, ignorarPedidoId){
  return db.pedidos
    .filter(p=> p.status==="Pendente" && p.id!==ignorarPedidoId)
    .reduce((s,p)=> s + pedidoItens(p).filter(i=>i.produtoId===produtoId).reduce((a,i)=>a+(Number(i.qtd)||0),0), 0);
}

/* O que dá pra vender agora: prateleira menos o que já foi prometido. */
function disponivel(produtoId, ignorarPedidoId){
  const e = getProduto(produtoId);
  if(!e) return 0;
  return (Number(e.qtd)||0) - comprometido(produtoId, ignorarPedidoId);
}

/* Reconcilia a baixa de estoque de um pedido.

   Sempre devolve o que esse pedido já tinha tirado antes (se tirou) e só
   então aplica a baixa nova. Fazer nessa ordem é o que faz funcionar
   quando o pedido é editado — trocar o produto, mudar a quantidade ou
   voltar de "Entregue" pra "Pendente" ficam todos corretos, sem precisar
   de um caso especial pra cada um. */
function reconciliarEstoquePedido(anterior, atual){
  if(anterior && anterior.estoqueBaixado){
    pedidoItens(anterior).forEach(i=>{ const e=getProduto(i.produtoId); if(e) e.qtd=(Number(e.qtd)||0)+(Number(i.qtd)||0); });
  }
  if(!atual) return;
  if(atual.status==="Entregue"){
    pedidoItens(atual).forEach(i=>{ const e=getProduto(i.produtoId); if(e){ e.qtd=(Number(e.qtd)||0)-(Number(i.qtd)||0); e.atualizadoEm=todayISO(); } });
    atual.estoqueBaixado = true;
  }else{
    atual.estoqueBaixado = false;
  }
}

/* Mesma ideia pro caminho inverso: lançamento de "Compra de estoque" no
   Financeiro entra como quantidade na prateleira. */
function reconciliarEstoqueCompra(anterior, atual){
  if(anterior) itensCompra(anterior).forEach(i=>{ const e=getProduto(i.produtoId); if(e) e.qtd=(Number(e.qtd)||0)-(Number(i.qtd)||0); });
  if(!atual) return;
  if(atual.categoria==="Compra de estoque"){
    itensCompra(atual).forEach(i=>{ const e=getProduto(i.produtoId); if(e&&Number(i.qtd)>0){ e.qtd=(Number(e.qtd)||0)+(Number(i.qtd)||0); e.atualizadoEm=todayISO(); } });
  }else{
    atual.itensEstoque = [];
  }
}
/* Gera (ou regenera) as parcelas de um pedido pago em "Parcelado
   personalizado". Nunca mexe nas parcelas já recebidas — só reajusta a
   numeração delas ("3/5"), pra continuar batendo depois de uma correção.
   As ainda não recebidas são sempre substituídas, recalculadas a partir
   do saldo restante (total do pedido menos o que já entrou) — é assim
   que "quanto o cliente ainda deve" fica sempre certo sem conta manual,
   inclusive quando o pedido é editado depois. */
function gerarParcelasPedido(pedido, cliente, parcelasAntigas){
  const liquidadas = parcelasAntigas.filter(f=>f.liquidado).sort((a,b)=>(a.vencimento||"").localeCompare(b.vencimento||""));
  const totalJaRecebido = liquidadas.reduce((s,f)=>s+(Number(f.valor)||0),0);
  const idsNaoRecebidas = parcelasAntigas.filter(f=>!f.liquidado).map(f=>f.id);
  if(idsNaoRecebidas.length) db.financeiro = db.financeiro.filter(f=>!idsNaoRecebidas.includes(f.id));

  const totalPedido = pedidoTotal(pedido);
  const restante = Math.max(0, Math.round((totalPedido-totalJaRecebido)*100)/100);
  const planoId = (parcelasAntigas[0] && parcelasAntigas[0].parcelamentoId) || uid();
  const freq = FREQUENCIAS[pedido.parcelaFrequencia] ? pedido.parcelaFrequencia : "semanal";
  const primeiro = pedido.parcelaPrimeiroVenc || todayISO();
  // o combinado é "N parcelas no total": as já recebidas contam, e o
  // restante se divide entre as que faltam
  const quantidadeNovas = restante>0 ? Math.max(1, (Number(pedido.parcelaQtd)||1) - liquidadas.length) : 0;

  dividirEmParcelas(restante, quantidadeNovas || 1).slice(0, quantidadeNovas).forEach((valor,k)=>{
    const indice = liquidadas.length + k;
    const venc = vencimentoParcela(primeiro, freq, indice);
    db.financeiro.push({
      id: uid(), data: venc, tipo:"Entrada", categoria:"Venda parcelada",
      descricao: `${pedidoResumoProdutos(pedido)} — ${cliente?cliente.nome:""}`,
      valor, pedidoId: pedido.id, clienteId: pedido.clienteId,
      parcelamentoId: planoId, parcelaNumero: indice+1, totalParcelas: liquidadas.length+quantidadeNovas,
      frequencia: FREQUENCIAS[freq].curto,
      formaPagamento: "Parcelado personalizado", obs: "",
      estoqueId: null, qtdEntrada: 0, itensEstoque: [],
      liquidado: false, liquidadoEm: null, vencimento: venc,
    });
  });
  liquidadas.forEach((f,i)=>{ f.parcelaNumero=i+1; f.totalParcelas=liquidadas.length+quantidadeNovas; });

  return quantidadeNovas>0
    ? `Entregue — ${quantidadeNovas} parcela${quantidadeNovas>1?"s lançadas":" lançada"} em A receber`
    : "Entregue — pedido já está totalmente pago";
}
/* Quantas parcelas o pedido combinou. Pedido gravado antes de 21/09
   guardava o valor da parcela, não a quantidade — nesse caso vale
   quantas parcelas ele de fato gerou. */
function qtdParcelasPedido(p){
  if(Number(p.parcelaQtd)>0) return Number(p.parcelaQtd);
  const geradas = db.financeiro.filter(f=>f.pedidoId===p.id && f.parcelamentoId).length;
  if(geradas) return geradas;
  return Number(p.parcelaValor)>0 ? Math.max(1, Math.ceil(pedidoTotal(p)/Number(p.parcelaValor))) : 2;
}
function freqPedido(p){ return FREQUENCIAS[p.parcelaFrequencia] ? p.parcelaFrequencia : freqLegada(p.parcelaIntervalo); }

function esc(s){ return (s??"").toString().replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

/* toast(msg) só avisa. toast(msg, {rotulo, fn}) avisa com um botão — é
   o "Desfazer" logo depois de marcar um recebimento, que é justamente
   quando o toque errado acontece. Com botão, fica mais tempo na tela. */
function toast(msg, acao){
  const t = document.getElementById("toast");
  t.innerHTML = "";
  const texto = document.createElement("span");
  texto.textContent = msg;
  t.appendChild(texto);
  t.classList.toggle("com-acao", !!acao);
  if(acao){
    const b = document.createElement("button");
    b.type = "button"; b.className = "toast-acao"; b.textContent = acao.rotulo;
    b.addEventListener("click", ()=>{ clearTimeout(toast._h); t.classList.remove("show"); acao.fn(); });
    t.appendChild(b);
  }
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), acao ? 6000 : 2200);
}

/* ---------- KPIs ---------- */
function computeKPIs(){
  const clientesAtivos = db.clientes.filter(c=>c.status==="Ativo").length;
  const leadsNovos = db.clientes.filter(c=>c.status==="Lead novo").length;
  const ym = todayISO().slice(0,7);
  const pedidosMes = db.pedidos.filter(p=>(p.data||"").slice(0,7)===ym);
  // pedido cancelado não é faturamento — contar ele inflava o número e fazia
  // o painel mostrar dinheiro que nunca entrou (corrigido em 2026-08-18)
  const pedidosMesValidos = pedidosMes.filter(p=>p.status!=="Cancelado");
  const faturamentoMes = pedidosMesValidos.reduce((s,p)=>s+pedidoTotal(p),0);
  const custoMes = pedidosMesValidos.reduce((s,p)=>s+pedidoCusto(p),0);
  const lucroMes = faturamentoMes - custoMes;
  // "baixo" agora olha o disponível (prateleira − prometido), não só a
  // prateleira: 8 na estante com 6 já prometidos é estoque baixo de verdade
  // produto prometido além do que existe — furo de estoque a caminho
  const estoqueNegativo = db.estoque.filter(e=> disponivel(e.id) < 0);
  // "baixo" exclui os que já estão no alerta de furo, pra não avisar duas
  // vezes do mesmo produto no painel
  const estoqueBaixo = db.estoque.filter(e=> disponivel(e.id) >= 0 && disponivel(e.id) <= Number(e.minimo));
  const valorEstoque = db.estoque.reduce((s,e)=> s + (Number(e.qtd)||0)*(Number(e.custoUnit)||0), 0);
  const followupsPendentes = db.followups.filter(f=>f.status==="Pendente");
  const followupsAtrasados = followupsPendentes.filter(f=>{
    const d = daysSince(f.ultimaInteracao);
    return d!==null && d>7;
  });
  // Saldo é DINHEIRO EM CAIXA: só conta o que foi de fato recebido/pago.
  // Venda entregue mas ainda não paga não entra aqui — ela aparece em
  // "a receber", senão o saldo mostraria dinheiro que ainda não chegou.
  const saldo = db.financeiro
    .filter(f=>f.liquidado)
    .reduce((s,f)=> s + (f.tipo==="Entrada"? Number(f.valor)||0 : -(Number(f.valor)||0)), 0);

  const pendentes = db.financeiro.filter(f=>!f.liquidado);
  const aReceberLista = pendentes.filter(f=>f.tipo==="Entrada");
  const aPagarLista = pendentes.filter(f=>f.tipo==="Saída");
  const aReceber = aReceberLista.reduce((s,f)=>s+(Number(f.valor)||0),0);
  const aPagar = aPagarLista.reduce((s,f)=>s+(Number(f.valor)||0),0);
  const hoje = todayISO();
  const vencidos = aReceberLista.filter(f=> f.vencimento && f.vencimento < hoje);
  const venceHoje = aReceberLista.filter(f=> f.vencimento === hoje);
  const aReceberVencido = vencidos.reduce((s,f)=>s+(Number(f.valor)||0),0);
  // três faixas do mesmo "a receber", pra caber "quanto entra essa
  // semana" sem esconder o total — a semana usa a mesma janela do
  // blocoEmAberto, o mês usa o `ym` de agora (não o mês navegado).
  const semana = semanaAtual();
  const aReceberSemana = aReceberLista.filter(f=>estaNaSemana(f.vencimento, semana)).reduce((s,f)=>s+(Number(f.valor)||0),0);
  const aReceberMesAtual = aReceberLista.filter(f=>(f.vencimento||"").slice(0,7)===ym).reduce((s,f)=>s+(Number(f.valor)||0),0);
  return {clientesAtivos, leadsNovos, pedidosMes, pedidosMesValidos, faturamentoMes,
          custoMes, lucroMes, estoqueBaixo, estoqueNegativo, valorEstoque,
          followupsPendentes, followupsAtrasados, saldo,
          aReceber, aReceberLista, aPagar, aPagarLista,
          vencidos, venceHoje, aReceberVencido, aReceberSemana, aReceberMesAtual};
}

/* ============================================================
   FINANCEIRO POR MÊS

   Os lançamentos sempre tiveram data, mas a tela mostrava tudo numa
   lista só, com um saldo geral — dava pra saber quanto tem no caixa,
   não como o mês foi. Aqui ficam as contas por competência mensal.
   ============================================================ */

const MESES = ["janeiro","fevereiro","março","abril","maio","junho",
               "julho","agosto","setembro","outubro","novembro","dezembro"];

function ymAtual(){ return todayISO().slice(0,7); }

function nomeMes(ym, capitalizado){
  const [a,m] = ym.split("-");
  const nome = MESES[Number(m)-1];
  // capitaliza só a primeira letra aqui, no lugar de usar
  // text-transform:capitalize no CSS — que deixaria "Agosto De 2026"
  return `${capitalizado ? nome[0].toUpperCase()+nome.slice(1) : nome} de ${a}`;
}

/* Anda pra frente ou pra trás sem depender de Date (que tropeça em
   virada de ano e fuso). */
function deslocaMes(ym, delta){
  let [a,m] = ym.split("-").map(Number);
  m += delta;
  while(m < 1){ m += 12; a--; }
  while(m > 12){ m -= 12; a++; }
  return `${a}-${String(m).padStart(2,"0")}`;
}

/* Fecha o mês: entradas, saídas, resultado e o saldo acumulado até o
   último dia dele — o acumulado é o que responde "quanto eu tinha em
   caixa no fim daquele mês", diferente do resultado isolado. */
function resumoMes(ym){
  const doMes = db.financeiro.filter(f => (f.data||"").slice(0,7) === ym);
  const soma = arr => arr.reduce((s,f)=>s+(Number(f.valor)||0),0);

  // "Entrou"/"Saiu" é dinheiro que se moveu de verdade. O que foi
  // entregue mas ainda não foi pago fica separado, em a receber.
  const entradas = soma(doMes.filter(f=>f.tipo==="Entrada" && f.liquidado));
  const saidas   = soma(doMes.filter(f=>f.tipo==="Saída"   && f.liquidado));
  const aReceberMes = soma(doMes.filter(f=>f.tipo==="Entrada" && !f.liquidado));
  const aPagarMes   = soma(doMes.filter(f=>f.tipo==="Saída"   && !f.liquidado));

  const acumulado = db.financeiro
    .filter(f => f.liquidado && (f.data||"").slice(0,7) <= ym)
    .reduce((s,f)=> s + (f.tipo==="Entrada" ? Number(f.valor)||0 : -(Number(f.valor)||0)), 0);

  // agrupa por categoria, separando o que entrou do que saiu
  const porCategoria = (tipo)=>{
    const mapa = {};
    doMes.filter(f=>f.tipo===tipo && f.liquidado).forEach(f=>{
      const cat = f.categoria || "Outro";
      mapa[cat] = (mapa[cat]||0) + (Number(f.valor)||0);
    });
    return Object.entries(mapa).sort((a,b)=> b[1]-a[1]);
  };

  return {
    ym, lancamentos: doMes, entradas, saidas, aReceberMes, aPagarMes,
    resultado: entradas - saidas,
    acumulado,
    entradasPorCategoria: porCategoria("Entrada"),
    saidasPorCategoria: porCategoria("Saída"),
  };
}

/* Meses que têm algum lançamento — usado pra dizer se vale oferecer
   navegação e pra montar o histórico. */
function mesesComMovimento(){
  return [...new Set(db.financeiro.map(f=>(f.data||"").slice(0,7)).filter(Boolean))].sort();
}

/* ---------- CALENDÁRIO DO FINANCEIRO ---------- */
const DIAS_SEMANA_ABREV = ["D","S","T","Q","Q","S","S"];

/* new Date(ano, mêsIndex, dia) monta em hora LOCAL, sem o problema de
   fuso do toISOString() — seguro pra contar dias do mês e descobrir em
   que dia da semana o mês começa. */
function diasNoMes(ym){
  const [a,m] = ym.split("-").map(Number);
  return new Date(a, m, 0).getDate();
}
function primeiroDiaSemanaDoMes(ym){
  const [a,m] = ym.split("-").map(Number);
  return new Date(a, m-1, 1).getDay();
}

/* Um ponto por dia com lançamento: verde se o líquido do dia é positivo,
   vermelho se negativo, âmbar se só tem coisa em aberto (nada líquido
   ainda). Clicar num dia filtra a lista de lançamentos pra só ele. */
function renderCalendarioMes(ym, lancamentos){
  const porDia = {};
  lancamentos.forEach(f=>{ (porDia[f.data]=porDia[f.data]||[]).push(f); });
  const totalDias = diasNoMes(ym), offset = primeiroDiaSemanaDoMes(ym), hoje = todayISO();
  let celulas = "";
  for(let i=0;i<offset;i++) celulas += `<div class="cal-cel vazio"></div>`;
  for(let d=1; d<=totalDias; d++){
    const iso = `${ym}-${String(d).padStart(2,"0")}`;
    const doDia = porDia[iso]||[];
    const liquido = doDia.filter(f=>f.liquidado).reduce((s,f)=> s+(f.tipo==="Entrada"?Number(f.valor)||0:-(Number(f.valor)||0)), 0);
    const temPendente = doDia.some(f=>!f.liquidado);
    const cor = !doDia.length ? "" : liquido>0 ? "var(--ok)" : liquido<0 ? "var(--critical)" : (temPendente ? "var(--warn)" : "var(--ink-faint)");
    celulas += `<button class="cal-cel${state.finDia===iso?" sel":""}${iso===hoje?" hoje":""}" data-dia="${iso}">
      <span>${d}</span>${doDia.length?`<span class="dot" style="background:${cor}"></span>`:""}
    </button>`;
  }
  return `
    <div class="cal-semana">${DIAS_SEMANA_ABREV.map(d=>`<div class="cab">${d}</div>`).join("")}</div>
    <div class="cal-grid">${celulas}</div>
    <div class="cal-legenda">
      <span><span class="dot" style="background:var(--ok)"></span>entrou mais do que saiu</span>
      <span><span class="dot" style="background:var(--critical)"></span>saiu mais do que entrou</span>
      <span><span class="dot" style="background:var(--warn)"></span>só em aberto</span>
    </div>
  `;
}

/* Saldo do cliente — tudo que é dele no Financeiro (venda, parcela de
   pedido, débito avulso, dívida antiga), separando o que já entrou do
   que ainda falta. Responde "quanto ele me deve e quanto já pagou" sem
   somar pedido por pedido na cabeça. */
function saldoCliente(clienteId){
  const hoje = todayISO();
  const fin = db.financeiro.filter(f=>f.tipo==="Entrada" && clienteIdDe(f)===clienteId);
  const emAberto = fin.filter(f=>!f.liquidado).sort((a,b)=>{
    if(!a.vencimento) return 1;
    if(!b.vencimento) return -1;
    return a.vencimento.localeCompare(b.vencimento);
  });
  const recebidos = fin.filter(f=>f.liquidado).sort((a,b)=>(b.liquidadoEm||b.data||"").localeCompare(a.liquidadoEm||a.data||""));
  const soma = arr => arr.reduce((s,f)=>s+(Number(f.valor)||0),0);
  return {
    emAberto, recebidos,
    totalDevido: soma(emAberto),
    totalPago: soma(recebidos),
    totalAtrasado: soma(emAberto.filter(f=>f.vencimento && f.vencimento<hoje)),
  };
}

function pedidoCard(p){
  const cl = getCliente(p.clienteId);
  const itens = pedidoItens(p);
  const total = pedidoTotal(p);
  const custo = pedidoCusto(p);
  const map = {"Pendente":"warn","Entregue":"ok","Cancelado":"critical"};
  const semVinculo = itens.some(i=>!i.produtoId || !getProduto(i.produtoId));
  const parcelado = p.formaPagamento==="Parcelado personalizado";
  // entregue mas ainda não pago — o(s) lançamento(s) ligado(s) a ele não liquidaram.
  // Parcelado gera vários lançamentos (um por parcela); os demais, só um.
  const finsPedido = db.financeiro.filter(f=>f.pedidoId===p.id);
  const fin = finsPedido[0];
  let aReceber, atrasado, resumoParcelas="";
  if(parcelado){
    const abertas = finsPedido.filter(f=>!f.liquidado);
    aReceber = p.status==="Entregue" && abertas.length>0;
    const proxima = abertas.slice().sort((a,b)=>(a.vencimento||"").localeCompare(b.vencimento||""))[0];
    atrasado = !!(proxima && proxima.vencimento && proxima.vencimento<todayISO());
    const totalAberto = abertas.reduce((s,f)=>s+(Number(f.valor)||0),0);
    resumoParcelas = aReceber ? `${finsPedido.length-abertas.length}/${finsPedido.length} parcelas recebidas — ${fmtMoney(totalAberto)} em aberto${proxima?`, próxima ${fmtDate(proxima.vencimento)}`:""}` : "";
  }else{
    aReceber = p.status==="Entregue" && fin && !fin.liquidado;
    atrasado = aReceber && p.vencimento && p.vencimento < todayISO();
  }
  return `<button class="card" data-pedido="${p.id}">
    <div class="card-row">
      <div>
        <div class="card-title">${esc(pedidoResumoProdutos(p)||"(sem produto)")}</div>
        <div class="card-sub">${cl?esc(cl.nome):"—"} · ${itens.length} item${itens.length!==1?"s":""}</div>
      </div>
      <div class="card-right"><div class="card-value tnum">${fmtMoney(total)}</div><span class="badge ${map[p.status]||"neutral"}">${esc(p.status||"—")}</span></div>
    </div>
    ${semVinculo?`<div class="card-meta" style="margin-top:6px"><span style="color:var(--critical)">Há item sem vínculo com o estoque — abra e escolha o produto</span></div>`:""}
    ${Number(p.desconto)>0?`<div class="card-meta" style="margin-top:6px"><span>desconto de ${fmtMoney(p.desconto)} sobre ${fmtMoney(pedidoSubtotal(p))}</span></div>`:""}
    ${parcelado && aReceber?`<div class="card-meta" style="margin-top:6px"><span style="color:${atrasado?"var(--critical)":"var(--warn)"}">${esc(resumoParcelas)}${atrasado?" — atrasada":""}</span></div>`:""}
    ${!parcelado && aReceber?`<div class="card-meta" style="margin-top:6px"><span style="color:${atrasado?"var(--critical)":"var(--warn)"}">${atrasado?`a receber — atrasado desde ${fmtDate(p.vencimento)}`:(p.vencimento?`a receber até ${fmtDate(p.vencimento)}`:"a receber — sem data combinada")}</span></div>`:""}
    <div class="card-meta">
      <span>${fmtDate(p.data)}</span>
      ${custo>0 && p.status!=="Cancelado" ? `<span>lucro ${fmtMoney(total-custo)}</span>` : `<span>${esc(p.formaPagamento||"—")}</span>`}
    </div>
  </button>`;
}
function followCard(f){
  const cl = getCliente(f.clienteId);
  const d = daysSince(f.ultimaInteracao);

  return `<button class="card" data-follow="${f.id}">
    <div class="card-row">
      <div><div class="card-title">${cl?esc(cl.nome):"—"}</div><div class="card-sub">${esc(f.motivo||"—")}</div></div>

      ${f.proximoContato?`<span>próximo: ${fmtDate(f.proximoContato)}</span>`:""}
    </div>
  </button>`;
}

/* ---------- FOLLOW-UP ---------- */
/* Avisos automáticos do Follow-up — não dependem de ninguém criar um
   follow-up manual, saem sozinhos do Financeiro: quem está devendo
   (a receber atrasado), quem tá pagando em dia (a receber vencendo nos
   próximos 3 dias) e conta fixa perto de vencer (Despesa fixa não paga,
   nos próximos 5 dias). */
function avisosAutomaticos(){
  const hoje = todayISO();
  const emAberto = db.financeiro.filter(f=>!f.liquidado && f.vencimento);
  const devedores = emAberto.filter(f=>f.tipo==="Entrada" && f.vencimento<hoje).sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
  const aVencer = emAberto.filter(f=>f.tipo==="Entrada" && f.vencimento>=hoje && f.vencimento<=deslocaData(hoje,3)).sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
  const contasFixas = emAberto.filter(f=>f.tipo==="Saída" && f.categoria==="Despesa fixa" && f.vencimento<=deslocaData(hoje,5)).sort((a,b)=>a.vencimento.localeCompare(b.vencimento));

  if(!devedores.length && !aVencer.length && !contasFixas.length) return "";

  const linha = (f, cor)=>{
    const cli = getCliente(f.clienteId) || (f.pedidoId ? getCliente((db.pedidos.find(p=>p.id===f.pedidoId)||{}).clienteId) : null);
    const atrasado = f.vencimento<hoje;
    const dias = daysSince(f.vencimento);
    const quando = atrasado ? `atrasado ${dias} dia${dias>1?"s":""}` : f.vencimento===hoje ? "vence hoje" : `vence ${fmtDate(f.vencimento)}`;
    return `<button class="alert-card" data-cliente-aviso="${cli?cli.id:""}">
      <span class="alert-dot" style="background:${cor}"></span>

/* ---------- DASHBOARD ---------- */
/* Três rankings + comparativo de meses, todos calculados na hora a
   partir de pedidos e financeiro — nada disso fica salvo à parte, então
   nunca desatualiza. */
function computeDashboard(){
  const porCliente = {};
  db.pedidos.filter(p=>p.status!=="Cancelado").forEach(p=>{ porCliente[p.clienteId] = (porCliente[p.clienteId]||0) + pedidoTotal(p); });
  const rankingClientes = Object.entries(porCliente)
    .map(([id,total])=>({cliente:getCliente(id), total}))
    .filter(r=>r.cliente).sort((a,b)=>b.total-a.total).slice(0,5);

  const devedorPorCliente = {};
  db.financeiro.filter(f=>f.tipo==="Entrada" && !f.liquidado).forEach(f=>{ const id=clienteIdDe(f); if(id) devedorPorCliente[id] = (devedorPorCliente[id]||0)+(Number(f.valor)||0); });
  const rankingDevedores = Object.entries(devedorPorCliente)
    .map(([id,total])=>({cliente:getCliente(id), total}))
    .filter(r=>r.cliente && r.total>0).sort((a,b)=>b.total-a.total).slice(0,5);

  const porProduto = {};
  db.pedidos.filter(p=>p.status!=="Cancelado").forEach(p=>{
    pedidoItens(p).forEach(i=>{
      if(!i.produtoId) return;
      porProduto[i.produtoId] = porProduto[i.produtoId] || {qtd:0, valor:0};
      porProduto[i.produtoId].qtd += Number(i.qtd)||0;
      porProduto[i.produtoId].valor += (Number(i.qtd)||0)*(Number(i.valorUnit)||0);
    });
  });
  const rankingProdutos = Object.entries(porProduto)
    .map(([id,v])=>({produto:getProduto(id), ...v}))
    .filter(r=>r.produto).sort((a,b)=>b.qtd-a.qtd).slice(0,5);

  const ymHoje = ymAtual();
  const comparativo = [5,4,3,2,1,0].map(i=>{ const ym=deslocaMes(ymHoje,-i); return {ym, ...resumoMes(ym)}; });

  return {rankingClientes, rankingDevedores, rankingProdutos, comparativo};
}

function renderDashboard(c){
  const d = computeDashboard();
  const semDados = !d.rankingClientes.length && !d.rankingProdutos.length && !d.comparativo.some(m=>m.lancamentos.length);
  if(semDados){
    c.innerHTML = `<div class="empty"><div class="big">Ainda sem dados suficientes</div><div class="small">O dashboard se preenche sozinho conforme pedidos e lançamentos forem entrando.</div></div>`;
    return;
  }
  const maxComprado = Math.max(1, ...d.rankingClientes.map(r=>r.total));
  const maxDevido = Math.max(1, ...d.rankingDevedores.map(r=>r.total));
  const maxProdutoValor = Math.max(1, ...d.rankingProdutos.map(r=>r.valor));
  const maxFaturamento = Math.max(1, ...d.comparativo.map(m=>m.entradas));

  c.innerHTML = `
    ${d.rankingClientes.length?`
      <div class="section-label">Clientes que mais compram</div>
      ${d.rankingClientes.map(r=>catRow(r.cliente.nome, r.total, maxComprado, "var(--ok)")).join("")}
    `:""}

    ${d.rankingDevedores.length?`
      <div class="section-label">Clientes que mais devem</div>
      ${d.rankingDevedores.map(r=>catRow(r.cliente.nome, r.total, maxDevido, "var(--critical)")).join("")}
    `:""}

    ${d.rankingProdutos.length?`
      <div class="section-label">Produtos mais vendidos</div>
      ${d.rankingProdutos.map(r=>catRow(`${r.produto.produto} · ${r.qtd} ${r.produto.unidade||"un"}`, r.valor, maxProdutoValor, "var(--accent)")).join("")}
    `:""}

    <div class="section-label">Faturamento — últimos 6 meses</div>
    ${d.comparativo.map(m=>catRow(nomeMes(m.ym,true).split(" de ")[0], m.entradas, maxFaturamento, "var(--ok)")).join("")}

}

/* ---------- ESTOQUE ---------- */
/* Organizado por categoria (2026-09-21) — antes era uma lista única em
   ordem alfabética, e achar um finalizador no meio dos tratamentos era
   rolar a tela toda. A ordem das categorias é a do cadastro; dentro de
   cada uma, alfabética. Produto com categoria fora da lista cai em

const CATEGORIAS_ESTOQUE = ["Tratamento","Finalizadores","Alinhamento","Outros"];
function categoriaDoProduto(e){ return CATEGORIAS_ESTOQUE.includes(e.categoria) ? e.categoria : "Outros"; }
function produtosPorCategoria(){
  return CATEGORIAS_ESTOQUE
    .map(cat=>({cat, itens: db.estoque.filter(e=>categoriaDoProduto(e)===cat).sort((a,b)=>a.produto.localeCompare(b.produto,"pt-BR"))}))
    .filter(g=>g.itens.length);
}

function cardProduto(e){

      <div style="min-width:0"><div class="card-title" style="font-size:18px;font-weight:700">${esc(e.produto)}</div><div class="card-sub">Venda ${fmtMoney(e.precoVenda)} · mínimo ${e.minimo}</div></div>

  </div>`;
}

/* Ajuste manual (contagem, quebra, perda). Compra pra revenda deve ir pelo
   Financeiro, que lança a despesa junto — por isso o aviso no rodapé da tela. */
function bumpEstoque(id, delta){
  const e = db.estoque.find(x=>x.id===id);
  if(!e) return;
  e.qtd = Math.max(0, (Number(e.qtd)||0) + delta);
  e.atualizadoEm = todayISO();
  saveDB(); renderEstoque(document.getElementById("content"));
}

/* ---------- FINANCEIRO ---------- */
/* Marca uma conta como recebida (ou paga). A data de liquidação é hoje,
   não a data do lançamento — é quando o dinheiro se moveu de verdade. */
function liquidar(id){
  const f = db.financeiro.find(x=>x.id===id);
  if(!f) return;
  f.liquidado = true;
  f.liquidadoEm = todayISO();
  // a partir daqui a data de vencimento não serve mais pra cobrar
  saveDB();
  toast(f.tipo==="Entrada" ? "Recebimento confirmado" : "Pagamento confirmado",
        {rotulo:"Desfazer", fn:()=> desfazerLiquidacao(id)});
  render();
}

/* O caminho de volta do "Recebi"/"Paguei" — pra quando tocou sem querer.
   A conta volta a ficar em aberto, com o vencimento que já tinha, e sai
   do caixa. Venda que tinha sido paga na entrega passa a ser "a receber"
   no próprio pedido também: sem isso, editar o pedido depois marcaria
   como recebido de novo, porque o pedido ainda diria "já recebi". */
function desfazerLiquidacao(id){
  const f = db.financeiro.find(x=>x.id===id);
  if(!f || !f.liquidado) return;
  f.liquidado = false;
  f.liquidadoEm = null;
  if(f.pedidoId && !f.parcelamentoId){
    const p = db.pedidos.find(x=>x.id===f.pedidoId);
    if(p && !p.aPrazo){ p.aPrazo = true; p.vencimento = f.vencimento || null; }
  }
  saveDB();
  toast(f.tipo==="Entrada" ? "Desfeito — a conta está em aberto de novo" : "Desfeito — a conta está a pagar de novo");
  render();
}

/* Pagamento de valor livre — pra quando o cliente paga diferente do
   combinado (R$ 130 numa parcela de R$ 100, sem avisar). Aplica a
   partir da conta `f`: quita ela e, se sobrar, rola o excedente pras
   próximas parcelas em aberto do mesmo parcelamento, na ordem; se faltar,
   quita só uma parte dela e deixa o restante em aberto na própria conta
   (mesmo vencimento, mesma parcela). Sem isso, R$ 130 numa de R$ 100 ou
   sumia com os R$ 30 ou cobrava eles de novo na parcela seguinte. */
function registrarPagamento(f, valorPago, data){
  let restante = Math.round((Number(valorPago)||0)*100);
  if(restante<=0) return {aplicado:0, sobra:0};
  const inicial = restante;
  const fila = [f];
  if(f.parcelamentoId){
    fila.push(...db.financeiro
      .filter(x=>x.parcelamentoId===f.parcelamentoId && x.id!==f.id && !x.liquidado)
      .sort((a,b)=>(a.parcelaNumero||0)-(b.parcelaNumero||0)));
  }
  for(const p of fila){
    if(restante<=0) break;
    const devido = Math.round((Number(p.valor)||0)*100);
    if(devido<=0) continue;
    if(restante>=devido){
      p.liquidado = true; p.liquidadoEm = data;
      restante -= devido;
    } else {
      db.financeiro.push({...p, id:uid(), valor:restante/100, liquidado:true, liquidadoEm:data});
      p.valor = (devido-restante)/100;
      restante = 0;
    }
  }
  return {aplicado:(inicial-restante)/100, sobra:restante/100};
}

/* Folha do "Recebi com valor diferente" — atalho ao lado do "Recebi" na
   ficha do cliente e no Financeiro, pra não precisar editar a parcela
   na mão toda vez que o pagamento não bate com o combinado. */
function openPagamentoForm(f){
  if(!f) return;
  const cli = getCliente(clienteIdDe(f));
  openSheet("Recebimento com valor diferente", `
    <p class="hint" style="margin-top:0">${esc(rotuloConta(f))}${cli?` — ${esc(cli.nome)}`:""} · combinado ${fmtMoney(f.valor)}</p>
    <div class="field-row">
      <div class="field"><label for="pg-valor">Valor pago (R$)</label><input id="pg-valor" type="number" inputmode="decimal" min="0.01" step="0.01" value="${f.valor}"></div>
      <div class="field"><label for="pg-data">Data do pagamento</label><input id="pg-data" type="date" value="${todayISO()}"></div>
    </div>
    <p class="hint">Pagou mais que essa parcela? O que sobrar entra na próxima parcela em aberto. Pagou menos? O que faltar continua em aberto, nessa mesma parcela.</p>
    <div class="btnrow">
      <button class="btn ghost" id="cancel">Cancelar</button>
      <button class="btn primary" id="save">Confirmar</button>
    </div>
  `, root=>{
    const valorEl = root.querySelector("#pg-valor");
    valorEl.focus(); valorEl.select();

        ? `Pagamento registrado — ${fmtMoney(sobra)} sobrou sem parcela em aberto pra entrar`
        : "Pagamento registrado");
      render();
    });
  });
}

/* Bloco de contas em aberto — fica no topo do Financeiro porque é a
   pergunta mais frequente do dia ("quem ainda me deve?"), e porque não
   pertence a um mês só: vence quando vence.

   Só mostra vencido + o que vence nesta semana — o resto (parcela lá na
   frente, ou sem data combinada) fica de fora daqui de propósito, pra
   não lotar o dia a dia com parcela que só vence daqui a um mês. Quem
   quiser confirmar um pagamento adiantado dessas entra na ficha do
   cliente, que continua listando tudo. */
function blocoEmAberto(){
  const k = computeKPIs();
  if(k.aReceberLista.length===0 && k.aPagarLista.length===0) return "";
  const hoje = todayISO();
  const semana = semanaAtual();
  const naJanela = f=> (f.vencimento && f.vencimento < hoje) || estaNaSemana(f.vencimento, semana);
  const aReceberVisivel = k.aReceberLista.filter(naJanela);
  const aPagarVisivel = k.aPagarLista.filter(naJanela);
  const receberFora = k.aReceberLista.length - aReceberVisivel.length;
  const pagarFora = k.aPagarLista.length - aPagarVisivel.length;

  const linha = (f)=>{
    const cli = getCliente(f.clienteId) || (f.pedidoId ? getCliente((db.pedidos.find(p=>p.id===f.pedidoId)||{}).clienteId) : null);
    const venc = f.vencimento;
    const atrasado = venc && venc < hoje;
    const hojeMesmo = venc === hoje;
    const dias = venc ? daysSince(venc) : null;
    const quando = !venc ? "sem data combinada"
      : atrasado ? `atrasado ${dias} dia${dias>1?"s":""} — venceu ${fmtDate(venc)}`
      : hojeMesmo ? "vence hoje"
      : `vence ${fmtDate(venc)}`;
    return `<div class="card" style="cursor:default">
      <div class="card-row">
        <div>
          <div class="card-title" style="font-family:inherit;font-size:15px;font-weight:600">${esc(cli?cli.nome:(f.descricao||f.categoria))}</div>
          <div class="card-sub">${esc(f.parcelamentoId?`${f.frequencia} · parcela ${f.parcelaNumero}/${f.totalParcelas}`:(cli ? (f.descricao||"").split(" — ")[0] : (f.categoria||"—")))}</div>
        </div>
        <div class="card-value tnum" style="color:${f.tipo==='Entrada'?'var(--ok)':'var(--critical)'}">${fmtMoney(f.valor)}</div>
      </div>
      <div class="card-row" style="margin-top:10px;align-items:center;gap:10px 12px;flex-wrap:wrap">
        <span class="badge ${atrasado?"critical":hojeMesmo?"warn":"neutral"}">${quando}</span>
        <div style="display:flex;gap:8px;margin-left:auto">
          ${f.tipo==="Entrada"?`<button class="btn ghost" style="flex:none;padding:8px 12px;font-size:13px" data-pagar="${f.id}">Valor diferente</button>`:""}
          <button class="btn primary" style="flex:none;padding:8px 14px;font-size:13px" data-liquidar="${f.id}">
            ${f.tipo==="Entrada"?"Recebi":"Paguei"}
          </button>
        </div>
      </div>
    </div>`;
  };

  // vencido primeiro, depois por data; sem data combinada vai pro fim
  const ordena = (a,b)=>{
    if(!a.vencimento) return 1;
    if(!b.vencimento) return -1;
    return a.vencimento.localeCompare(b.vencimento);
  };

  return `

function catRow(nome, valor, total, cor){
