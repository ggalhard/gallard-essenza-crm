  </div>`;
}

function renderFinanceiro(c){
  state.finMes = state.finMes || ymAtual();
  const ym = state.finMes;
  const r = resumoMes(ym);
  const meses = mesesComMovimento();
  const anterior = resumoMes(deslocaMes(ym,-1));

  // só trava a navegação onde não existe mais nada pra ver: antes do
  // primeiro lançamento e depois do último. Parcela de "Parcelado
  // personalizado" cai em mês futuro (a data dela é o vencimento) — por
  // isso não trava mais em "hoje": trava no último mês que tem
  // lançamento, e esse último pode estar à frente do mês atual.
  const primeiroMes = meses.length ? meses[0] : ymAtual();
  const ultimoMes = meses.length && meses[meses.length-1] > ymAtual() ? meses[meses.length-1] : ymAtual();
  const podeVoltar = ym > primeiroMes;
  const podeAvancar = ym < ultimoMes;

  const difResultado = r.resultado - anterior.resultado;
  const temAnterior = anterior.lancamentos.length > 0;

  c.innerHTML = `
    ${blocoEmAberto()}

    <div class="mesnav">
      <button id="mes-ant" ${podeVoltar?"":"disabled"} aria-label="Mês anterior">‹</button>
      <div class="rotulo">${nomeMes(ym,true)}<small>${r.lancamentos.length} lançamento(s)</small></div>
      <button id="mes-prox" ${podeAvancar?"":"disabled"} aria-label="Próximo mês">›</button>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="v tnum" style="color:var(--ok)">${fmtMoney(r.entradas)}</div><div class="l">Entrou no mês</div></div>
      <div class="kpi"><div class="v tnum" style="color:var(--critical)">${fmtMoney(r.saidas)}</div><div class="l">Saiu no mês</div></div>
    </div>

    ${(r.aReceberMes>0 || r.aPagarMes>0) ? `
      <div class="kpi" style="margin-top:10px">
        <div class="v tnum" style="font-size:22px">${r.aReceberMes>0?fmtMoney(r.aReceberMes):fmtMoney(r.aPagarMes)}</div>
        <div class="l">${r.aReceberMes>0?"vendido nesse mês e ainda não recebido":"lançado nesse mês e ainda não pago"}</div>
      </div>
    `:""}

    <div class="kpi" style="margin-top:10px">
      <div class="v tnum" style="color:${r.resultado>=0?'var(--ok)':'var(--critical)'}">${r.resultado>=0?"+":"−"} ${fmtMoney(Math.abs(r.resultado))}</div>
      <div class="l">Resultado de ${nomeMes(ym).split(" de ")[0]}${temAnterior?` · ${difResultado>=0?"▲":"▼"} ${fmtMoney(Math.abs(difResultado))} vs. mês anterior`:""}</div>
    </div>

    <div class="kpi" style="margin-top:10px">
      <div class="v tnum">${fmtMoney(r.acumulado)}</div>
      <div class="l">Saldo acumulado até o fim desse mês</div>
    </div>

    ${r.entradasPorCategoria.length ? `
      <div class="section-label">De onde veio</div>
      ${r.entradasPorCategoria.map(([cat,val])=> catRow(cat, val, r.entradas, "var(--ok)")).join("")}
    ` : ""}

    ${r.saidasPorCategoria.length ? `
      <div class="section-label">Para onde foi</div>
      ${r.saidasPorCategoria.map(([cat,val])=> catRow(cat, val, r.saidas, "var(--critical)")).join("")}
    ` : ""}

    <div class="section-label" style="display:flex;justify-content:space-between;align-items:center">
      <span>Lançamentos</span>
      <div class="chiprow" style="margin:0">
        <button class="chip" aria-pressed="${state.finView!=="calendario"}" data-view="lista">Lista</button>
        <button class="chip" aria-pressed="${state.finView==="calendario"}" data-view="calendario">Calendário</button>
      </div>
    </div>
    ${state.finView==="calendario" ? renderCalendarioMes(ym, r.lancamentos) : ""}
    ${state.finView==="calendario" && state.finDia ? `<button class="btn ghost" id="limpar-dia" style="width:100%;margin:10px 0">Ver o mês inteiro</button>` : ""}
    <div id="fin-list"></div>
  `;

  c.querySelector("#mes-ant").addEventListener("click", ()=>{ state.finMes = deslocaMes(ym,-1); state.finDia=null; renderFinanceiro(document.getElementById("content")); });
  c.querySelector("#mes-prox").addEventListener("click", ()=>{ state.finMes = deslocaMes(ym, 1); state.finDia=null; renderFinanceiro(document.getElementById("content")); });
  c.querySelectorAll("[data-liquidar]").forEach(b=> b.addEventListener("click", ()=> liquidar(b.dataset.liquidar)));
  c.querySelectorAll("[data-pagar]").forEach(b=> b.addEventListener("click", ()=> openPagamentoForm(db.financeiro.find(f=>f.id===b.dataset.pagar))));
  c.querySelectorAll("[data-view]").forEach(b=> b.addEventListener("click", ()=>{ state.finView=b.dataset.view; if(state.finView!=="calendario") state.finDia=null; renderFinanceiro(document.getElementById("content")); }));
  c.querySelectorAll("[data-dia]").forEach(b=> b.addEventListener("click", ()=>{ state.finDia = state.finDia===b.dataset.dia ? null : b.dataset.dia; renderFinanceiro(document.getElementById("content")); }));
  const limparDia = c.querySelector("#limpar-dia");
  if(limparDia) limparDia.addEventListener("click", ()=>{ state.finDia=null; renderFinanceiro(document.getElementById("content")); });

  const lancamentosFiltrados = state.finDia ? r.lancamentos.filter(f=>f.data===state.finDia) : r.lancamentos;
  const box = c.querySelector("#fin-list");
  if(lancamentosFiltrados.length===0){
    box.innerHTML = `<div class="empty" style="padding:26px 12px">
      <div class="small">${state.finDia ? `Nenhum lançamento em ${fmtDate(state.finDia)}.` : `Nenhum lançamento em ${nomeMes(ym)}.${podeVoltar?" Use a seta pra ver um mês anterior.":" Toque no + pra lançar o primeiro."}`}</div>
    </div>`;
    return;
  }

  // agrupa por dia, mais recente primeiro — dentro do dia, entrada antes de saída
  const porDia = {};
  lancamentosFiltrados.forEach(f=>{ (porDia[f.data] = porDia[f.data] || []).push(f); });

  box.innerHTML = Object.keys(porDia).sort().reverse().map(dia=>{
    const doDia = porDia[dia].slice().sort((a,b)=> (a.tipo==="Entrada"?0:1) - (b.tipo==="Entrada"?0:1));
    // só o que se moveu de verdade: conta a receber não mexeu no caixa
    const liquido = doDia.filter(f=>f.liquidado)
      .reduce((s,f)=> s + (f.tipo==="Entrada"? Number(f.valor)||0 : -(Number(f.valor)||0)), 0);
    const temPendente = doDia.some(f=>!f.liquidado);
    return `
      <div class="section-label" style="margin-top:14px;display:flex;justify-content:space-between">
        <span>${fmtDate(dia)}</span>
        <span class="tnum" style="letter-spacing:0;text-transform:none">${(liquido===0&&temPendente)?"—":`${liquido>=0?"+":"−"} ${fmtMoney(Math.abs(liquido))}`}</span>
      </div>
      ${doDia.map(f=>`
        <div class="card" style="cursor:pointer" data-edit="${f.id}">
          <div class="card-row">
            <div>
              <div class="card-title" style="font-family:inherit;font-size:15px;font-weight:600">${esc(f.descricao||f.categoria)}</div>
              <div class="card-sub">${esc(f.categoria||"—")}${f.pedidoId?" · via pedido entregue":""}${itensCompra(f).length?` · +${itensCompra(f).length} item(ns) no estoque`:""}${f.parcelamentoId?` · parcela ${f.parcelaNumero}/${f.totalParcelas}`:""}</div>
            </div>
            <div class="card-right">
              <div class="card-value tnum" style="color:${f.liquidado?(f.tipo==='Entrada'?'var(--ok)':'var(--critical)'):'var(--ink-faint)'}">${f.tipo==='Entrada'?'+':'−'} ${fmtMoney(f.valor)}</div>
              ${f.liquidado?"":`<span class="badge ${f.vencimento && f.vencimento<todayISO() ? "critical":"warn"}">${f.tipo==="Entrada"?"a receber":"a pagar"}</span>`}
            </div>
          </div>
          <div class="card-meta">
            <span>${esc(f.formaPagamento||"—")}</span>
            ${f.liquidado && f.liquidadoEm && f.liquidadoEm!==f.data ? `<span>recebido em ${fmtDate(f.liquidadoEm)}</span>` : ""}
          </div>
        </div>
      `).join("")}`;
  }).join("");

  box.querySelectorAll("[data-edit]").forEach(el=> el.addEventListener("click", ()=> openFinanceiroForm(db.financeiro.find(x=>x.id===el.dataset.edit))));
}

      <div class="row"><span>Tamanho dos dados</span><span class="tnum">${sizeKB} KB</span></div>
    </div>
    <button class="btn primary" style="width:100%;margin-bottom:10px" id="export-btn">Exportar backup</button>
    <label class="btn ghost" style="width:100%;display:block;text-align:center;margin-bottom:24px" for="import-file">Importar backup</label>
    <input type="file" id="import-file" accept="application/json" style="display:none">
    <div class="section-label">Zona de risco</div>
    <button class="btn danger" style="width:100%" id="clear-btn">Apagar todos os dados</button>
  `;
  c.querySelector("#export-btn").addEventListener("click", exportBackup);
  c.querySelector("#import-file").addEventListener("change", importBackup);
  c.querySelector("#clear-btn").addEventListener("click", ()=>{
    if(confirm("Apagar TODOS os dados desse caderno? Não tem como desfazer — exporte um backup antes se não tiver certeza.")){
      db = structuredClone(EMPTY_DB); saveDB(); toast("Dados apagados"); setView("inicio");
    }
  });
}
async function exportBackup(){
  const filename = `gallard-essenza-backup-${todayISO()}.json`;
  const data = JSON.stringify(db, null, 2);
  const downloads = await (window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null));
  if(downloads){
    try{
      await downloads.save({filename, data});
      toast("Backup salvo");
      return;
    }catch(e){ /* segue pro fallback abaixo */ }
  }
  // fallback: link de download comum, caso a capacidade não esteja disponível
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url);
  toast("Backup baixado");
}
function importBackup(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== "object") throw new Error("formato inválido");
      if(!confirm("Importar vai SUBSTITUIR os dados atuais desse caderno pelos do arquivo. Continuar?")) return;
      // backup de uma versão antiga do app passa pela mesma migração do
      // loadDB — sem isso, pedido sem lista de itens quebrava a tela
      const merged = Object.assign(structuredClone(EMPTY_DB), parsed);
      merged.schema = Number(parsed.schema) || 1;
      db = normalizarEstoque(migrar(merged));
      saveDB(); toast("Backup importado"); setView("inicio");
    }catch(e){
      alert("Não consegui ler esse arquivo como backup válido.");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

   FORMULÁRIOS (bottom sheet)
   ============================================================ */
/* Botão físico/gesto de voltar do Android, num PWA instalado, fecha o
   app se não houver histórico próprio — cada cadastro aberto empurra
   uma entrada, e o "voltar" do sistema consome ela primeiro, fechando
   só a ficha em vez de sair do app. `sheetHistoryPushed` evita o loop
   entre closeSheet() chamando history.back() e o popstate chamando
   closeSheet() de volta. */
let sheetHistoryPushed = false;
window.addEventListener("popstate", ()=>{
  if(document.getElementById("modal-root").innerHTML !== ""){
    closeSheet(true);
  }
});

function openSheet(title, bodyHTML, onMount){
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">${esc(title)}</div>
        ${bodyHTML}
      </div>
    </div>
  `;
  document.getElementById("ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeSheet(); });
  history.pushState({sheet:true}, "");
  sheetHistoryPushed = true;
  onMount && onMount(root);
}
function closeSheet(fromPopstate){
  document.getElementById("modal-root").innerHTML = "";
  if(sheetHistoryPushed){
    sheetHistoryPushed = false;
    if(!fromPopstate) history.back();
  }
}

      <p class="hint">Cada parcela vira uma conta a receber na ficha do cliente. Marcar uma como recebida não mexe nas outras — é assim que dá pra saber quanto ele ainda deve.</p>
    </div>

    <div class="field"><label>Observações</label><textarea id="f-obs">${esc(v.obs||"")}</textarea></div>
    <p class="hint">Pedido <b>Pendente</b> reserva a quantidade, mas não tira do estoque. Quando vira <b>Entregue</b>, sai do estoque na hora — e o dinheiro só entra no caixa quando você marcar como recebido.</p>
    <div class="btnrow">
      <button class="btn ghost" id="cancel">Cancelar</button>
      <button class="btn primary" id="save">${isEdit?"Salvar":"Lançar pedido"}</button>
    </div>
    ${isEdit?`<button class="btn danger" style="width:100%;margin-top:10px" id="del">Excluir pedido</button>`:""}
  `, root=>{
    const totEl=root.querySelector("#f-total"), subtotalEl=root.querySelector("#f-subtotal"),
          statusEl=root.querySelector("#f-status"), itensBox=root.querySelector("#pedido-itens"),
          descontoEl=root.querySelector("#f-desconto"), descontoTipoEl=root.querySelector("#f-desconto-tipo"),
          descontoNota=root.querySelector("#desconto-nota");

    /* Declarado antes de renderItens/atualizaTotal de propósito: os dois
       chamam atualizaPreviaParcelaPedido(), que lê estes campos — se essa
       const viesse depois, a primeira chamada de atualizaTotal() quebraria
       (TDZ, "Cannot access before initialization"). */
    const recBox = root.querySelector("#rec-box"), recEl = root.querySelector("#f-recebi"),
          vencBox = root.querySelector("#venc-box"), vencEl = root.querySelector("#f-venc"),
          pagEl = root.querySelector("#f-pag"),
          parcelPedBox = root.querySelector("#parcel-ped-box");
    let parcelasPed = null; // calculadora de parcelas — ligada logo abaixo, depois das funções de total
    function ehParcelado(){ return pagEl.value==="Parcelado personalizado"; }

    /* Desconto sempre guardado em R$ no pedido (ver pedidoTotal); o campo
       "Tipo" só decide como o número digitado aqui é convertido na hora
       de calcular — % é sobre o subtotal, nunca sobre um desconto já
       aplicado antes. Nunca deixa o total ficar negativo. */
    function subtotalAtual(){ return itens.reduce((s,i)=>s+(Number(i.qtd)||0)*(Number(i.valorUnit)||0),0); }
    function descontoAtualRS(){
      const subtotal = subtotalAtual(), digitado = Number(descontoEl.value)||0;
      const bruto = descontoTipoEl.value==="pct" ? subtotal*(digitado/100) : digitado;
      return Math.min(subtotal, Math.max(0, bruto));
    }
    function atualizaPreviaParcelaPedido(){ if(parcelasPed) parcelasPed.atualizar(); }

    function renderItens(){
      itensBox.innerHTML=itens.map((i,n)=>{
        const e=getProduto(i.produtoId), disp=e?disponivel(e.id,isEdit?v.id:null):0;
        const pedida=itens.filter(x=>x.produtoId===i.produtoId).reduce((s,x)=>s+(Number(x.qtd)||0),0);
        const aviso=e&&pedida>disp?`<div class="hint" style="color:var(--critical)">Só ${disponiveis(disp)} — faltam ${pedida-disp}.</div>`:`<div class="hint">${e?disponiveis(disp):"Escolha um produto do estoque"}</div>`;
        return `<div class="card" style="cursor:default;padding:12px;margin:8px 0"><div class="field"><label>Produto</label><select data-prod="${n}"><option value="">— selecione —</option>${produtoOptions(i.produtoId)}</select></div><div class="field-row"><div class="field"><label>Quantidade</label><input data-qtd="${n}" type="number" min="1" value="${i.qtd??1}"></div><div class="field"><label>Valor unitário</label><input data-valor="${n}" type="number" min="0" step="0.01" value="${i.valorUnit??""}"></div></div>${aviso}${itens.length>1?`<button class="btn ghost" type="button" data-rem="${n}" style="width:100%;margin-top:4px">Remover item</button>`:""}</div>`;
      }).join("");
      itensBox.querySelectorAll("[data-prod]").forEach(el=>el.addEventListener("change",()=>{ const i=itens[el.dataset.prod],e=getProduto(el.value); i.produtoId=el.value; i.produto=e?e.produto:""; i.valorUnit=e?(Number(e.precoVenda)||0):0; i.custoUnit=e?(Number(e.custoUnit)||0):0; renderItens(); atualizaTotal(); }));
      itensBox.querySelectorAll("[data-qtd]").forEach(el=>el.addEventListener("input",()=>{ itens[el.dataset.qtd].qtd=Number(el.value)||0; atualizaTotal(); renderItens(); }));
      itensBox.querySelectorAll("[data-valor]").forEach(el=>el.addEventListener("input",()=>{ itens[el.dataset.valor].valorUnit=Number(el.value)||0; atualizaTotal(); }));
      itensBox.querySelectorAll("[data-rem]").forEach(el=>el.addEventListener("click",()=>{ itens.splice(Number(el.dataset.rem),1); renderItens(); atualizaTotal(); }));
    }
    function atualizaTotal(){
      const subtotal = subtotalAtual(), desc = descontoAtualRS();
      subtotalEl.textContent = fmtMoney(subtotal);
      totEl.textContent = fmtMoney(Math.max(0, subtotal-desc));
      descontoNota.textContent = desc>0
        ? `Desconto de ${fmtMoney(desc)}${subtotal>0?` (${Math.round(desc/subtotal*100)}% do subtotal)`:""}.`
        : "Sem desconto neste pedido.";
      if(typeof atualizaPreviaParcelaPedido==="function") atualizaPreviaParcelaPedido();
    }
    root.querySelector("#add-item").addEventListener("click",()=>{ const e=db.estoque[0]; itens.push({produtoId:e.id,produto:e.produto,qtd:1,valorUnit:Number(e.precoVenda)||0,custoUnit:Number(e.custoUnit)||0}); renderItens(); atualizaTotal(); });
    descontoEl.addEventListener("input", atualizaTotal);
    descontoTipoEl.addEventListener("change", atualizaTotal);
    // o 1º vencimento sugerido parte da entrega (ou da data do pedido)
    const dataBasePedido = ()=> root.querySelector("#f-entrega").value || root.querySelector("#f-data").value || todayISO();
    parcelasPed = ligarParcelas(root, "pp", ()=> Math.max(0, subtotalAtual()-descontoAtualRS()), dataBasePedido);
    ["#f-entrega","#f-data"].forEach(sel=> root.querySelector(sel).addEventListener("change", ()=>{ parcelasPed.sugerirData(); parcelasPed.atualizar(); }));
    renderItens(); atualizaTotal();

    /* O bloco de recebimento só aparece quando o pedido está Entregue —
       antes disso não há o que receber. E o campo de data só quando ela
       escolhe "a receber". Parcelado personalizado usa um bloco próprio
       no lugar deste, porque não é um único vencimento. */
    function toggleRecebimento(){
      const entregue = statusEl.value==="Entregue";
      recBox.style.display = (entregue && !ehParcelado()) ? "block" : "none";
      parcelPedBox.style.display = (entregue && ehParcelado()) ? "block" : "none";
      const aPrazo = recEl.value==="nao";
      vencBox.style.display = (entregue && !ehParcelado() && aPrazo) ? "block" : "none";
      // sugere uma data em vez de deixar em branco: o caso comum é
      // combinar pra alguns dias depois da entrega
      if(aPrazo && !vencEl.value){
        const base = root.querySelector("#f-entrega").value || root.querySelector("#f-data").value || todayISO();
        const d = new Date(base+"T00:00:00");
        d.setDate(d.getDate()+7);
        vencEl.value = d.toISOString().slice(0,10);
      }
      atualizaPreviaParcelaPedido();
    }
    recEl.addEventListener("change", toggleRecebimento);
    pagEl.addEventListener("change", toggleRecebimento);
    toggleRecebimento();

    statusEl.addEventListener("change", toggleRecebimento);

    root.querySelector("#cancel").addEventListener("click", closeSheet);
    if(isEdit) root.querySelector("#del").addEventListener("click", ()=>{
      if(confirm("Excluir esse pedido?\n\nO lançamento no Financeiro sai junto, e se o pedido já tinha dado baixa, a quantidade volta pro estoque.")){
        reconciliarEstoquePedido(existing, null);
        db.financeiro = db.financeiro.filter(f=>f.pedidoId!==existing.id);
        db.pedidos = db.pedidos.filter(p=>p.id!==existing.id);
        saveDB(); closeSheet(); toast("Pedido excluído"); setView("pedidos");
      }
    });
    root.querySelector("#save").addEventListener("click", ()=>{
      const itensValidos=itens.filter(i=>i.produtoId && Number(i.qtd)>0);
      if(!itensValidos.length || itensValidos.length!==itens.length || itensValidos.some(i=>!getProduto(i.produtoId))){ alert("Escolha um produto do estoque e uma quantidade para cada item."); return; }
      const formaPag = root.querySelector("#f-pag").value;
      const parcelado = formaPag==="Parcelado personalizado";
      const plano = parcelasPed.ler();
      if(statusEl.value==="Entregue" && parcelado && !plano.primeiro){ alert("Escolha a data do 1º vencimento das parcelas."); return; }
      const rec = {
        id: existing?existing.id:uid(),
        clienteId: root.querySelector("#f-cliente").value,
        data: root.querySelector("#f-data").value || todayISO(),
        itens: itensValidos.map(i=>({...i,qtd:Number(i.qtd)||0,valorUnit:Number(i.valorUnit)||0,custoUnit:Number(i.custoUnit)||0})),
        desconto: descontoAtualRS(),
        formaPagamento: formaPag,
        status: statusEl.value,
        dataEntrega: root.querySelector("#f-entrega").value,
        obs: root.querySelector("#f-obs").value.trim(),
        estoqueBaixado: false, qtdBaixada: 0,
        aPrazo: statusEl.value==="Entregue" && !parcelado && recEl.value==="nao",
        vencimento: (statusEl.value==="Entregue" && !parcelado && recEl.value==="nao") ? (vencEl.value || null) : null,
        parcelaQtd: parcelado ? plano.qtd : null,
        parcelaFrequencia: parcelado ? plano.freq : null,
        parcelaPrimeiroVenc: parcelado ? (plano.primeiro || todayISO()) : null,
      };

      // devolve a baixa antiga e aplica a nova — cobre troca de produto,
      // mudança de quantidade e ida/volta entre Pendente e Entregue
      reconciliarEstoquePedido(existing || null, rec);

      if(isEdit){ db.pedidos = db.pedidos.map(p=>p.id===rec.id?rec:p); }
      else{ db.pedidos.push(rec); }

      // lançamento financeiro segue o status: só existe se estiver Entregue.
      // Parcelas já recebidas nunca são apagadas — é o que permite corrigir
      // um pedido parcelado sem perder o que o cliente já pagou.
      const cli = getCliente(rec.clienteId);
      const entriesAntigas = db.financeiro.filter(f=>f.pedidoId===rec.id);
      const entradaUnicaAntiga = entriesAntigas.find(f=>!f.parcelamentoId);
      const parcelasAntigas = entriesAntigas.filter(f=>f.parcelamentoId);
      let jaRecebido = false, mensagemParcelas = null;

      if(rec.status==="Entregue" && parcelado){
        if(entradaUnicaAntiga) db.financeiro = db.financeiro.filter(f=>f.id!==entradaUnicaAntiga.id);
        // Nada do combinado mudou (total, nº de parcelas, frequência, 1º
        // vencimento)? Então as parcelas ficam como estão — inclusive uma
        // data ou valor ajustado à mão numa delas. Refazer aqui mudaria
        // valores só porque você corrigiu uma observação no pedido.
        const planoIgual = existing && existing.status==="Entregue" && existing.formaPagamento==="Parcelado personalizado"
          && parcelasAntigas.length>0
          && Math.abs(pedidoTotal(existing)-pedidoTotal(rec)) < 0.005
          && qtdParcelasPedido(existing)===rec.parcelaQtd
          && freqPedido(existing)===rec.parcelaFrequencia
          && (existing.parcelaPrimeiroVenc||"")===rec.parcelaPrimeiroVenc;
        if(planoIgual){
          parcelasAntigas.forEach(f=>{ f.clienteId = rec.clienteId; f.descricao = `${pedidoResumoProdutos(rec)} — ${cli?cli.nome:""}`; });
          mensagemParcelas = "Pedido atualizado — parcelas mantidas";
        }else{
          mensagemParcelas = gerarParcelasPedido(rec, cli, parcelasAntigas);
        }
      }else{
        // saiu do parcelado (ou nunca esteve nele): as parcelas ainda não
        // recebidas não fazem mais sentido pro novo plano — remove só essas,
        // as recebidas ficam como histórico
        const idsNaoRecebidas = parcelasAntigas.filter(f=>!f.liquidado).map(f=>f.id);
        if(idsNaoRecebidas.length) db.financeiro = db.financeiro.filter(f=>!idsNaoRecebidas.includes(f.id));

        // !! obrigatório: sem ele isso vira undefined, e JSON.stringify
        // descarta chave undefined — o campo sumiria do que fica salvo
        jaRecebido = !!(entradaUnicaAntiga && entradaUnicaAntiga.liquidado && rec.aPrazo);
        if(entradaUnicaAntiga) db.financeiro = db.financeiro.filter(f=>f.id!==entradaUnicaAntiga.id);
        if(rec.status==="Entregue"){
          const liquidado = !rec.aPrazo || jaRecebido;
          db.financeiro.push({
            id: entradaUnicaAntiga ? entradaUnicaAntiga.id : uid(),
            data: rec.dataEntrega||rec.data, tipo:"Entrada", categoria:"Venda de produto",
            descricao: `${pedidoResumoProdutos(rec)} — ${cli?cli.nome:""}`, valor: pedidoTotal(rec),
            pedidoId: rec.id, clienteId: rec.clienteId, formaPagamento: rec.formaPagamento, obs:"",
            estoqueId: null, qtdEntrada: 0, itensEstoque: [],
            liquidado,
            liquidadoEm: liquidado ? (jaRecebido ? entradaUnicaAntiga.liquidadoEm : (rec.dataEntrega||rec.data)) : null,
            vencimento: rec.aPrazo ? rec.vencimento : null,
          });
        }
      }
      saveDB(); closeSheet();
      toast(rec.status!=="Entregue" ? (isEdit?"Pedido atualizado":"Pedido lançado")
            : mensagemParcelas ? mensagemParcelas
            : rec.aPrazo && !jaRecebido ? `Entregue — a receber${rec.vencimento?" até "+fmtDate(rec.vencimento):""}`
            : "Pedido entregue — estoque e caixa atualizados");
      render();
    });
  });
}

function openEstoqueForm(existing){
  const isEdit = !!existing;
  const v = existing || {categoria:"Tratamento", unidade:"Unidades", qtd:0, minimo:5, atualizadoEm:todayISO()};
  openSheet(isEdit?"Editar produto":"Novo produto", `

    <div class="field-row">

      <div class="field"><label>Unidade</label><select id="f-un">${["Unidades"].map(o=>`<option ${v.unidade===o?"selected":""}>${o}</option>`).join("")}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Qtd. em estoque</label><input id="f-qtd" type="number" min="0" value="${v.qtd}"></div>
      <div class="field"><label>Estoque mínimo</label><input id="f-min" type="number" min="0" value="${v.minimo}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Custo unitário</label><input id="f-custo" type="number" min="0" step="0.01" value="${v.custoUnit??""}"></div>
      <div class="field"><label>Preço de venda</label><input id="f-preco" type="number" min="0" step="0.01" value="${v.precoVenda??""}"></div>
    </div>

      <button class="btn primary" id="save">${isEdit?"Salvar":"Cadastrar"}</button>

    ${isEdit?`<button class="btn danger" style="width:100%;margin-top:10px" id="del">Excluir produto</button>`:""}
  `, root=>{
    root.querySelector("#cancel").addEventListener("click", closeSheet);
    if(isEdit) root.querySelector("#del").addEventListener("click", ()=>{
      // pedido que aponta pra um produto apagado fica órfão e some do
      // relatório — avisar antes, com o número real, em vez de deixar quebrar
      const ligados = db.pedidos.filter(p=>pedidoItens(p).some(i=>i.produtoId===existing.id));
      const pendentes = ligados.filter(p=>p.status==="Pendente").length;
      if(ligados.length){
        const ok = confirm(
          `"${existing.produto}" está em ${ligados.length} pedido(s)${pendentes?` — ${pendentes} ainda pendente(s)`:""}.\n\n`+
          `Excluir o produto mantém esses pedidos no histórico, mas eles ficam sem vínculo: não dá mais pra dar baixa nem editar sem escolher outro produto.\n\nExcluir mesmo assim?`);
        if(!ok) return;
      }else if(!confirm("Excluir esse produto do estoque?")) return;
      db.estoque = db.estoque.filter(e=>e.id!==existing.id);
      saveDB(); closeSheet(); toast("Produto excluído"); render();
    });
    root.querySelector("#save").addEventListener("click", ()=>{
      const produto = root.querySelector("#f-produto").value.trim();
      if(!produto){ alert("Descreva o produto."); return; }
      const rec = {
        id: existing?existing.id:uid(),
        produto,
        categoria: root.querySelector("#f-cat").value,
        unidade: root.querySelector("#f-un").value,
        qtd: Number(root.querySelector("#f-qtd").value)||0,
        minimo: Number(root.querySelector("#f-min").value)||0,
        custoUnit: Number(root.querySelector("#f-custo").value)||0,
        precoVenda: Number(root.querySelector("#f-preco").value)||0,
        atualizadoEm: todayISO(),
      };
      if(isEdit){ db.estoque = db.estoque.map(e=>e.id===rec.id?rec:e); }
      else{ db.estoque.push(rec); }
      saveDB(); closeSheet(); toast(isEdit?"Produto atualizado":"Produto cadastrado"); setView("estoque");
    });
  });
}

/* Categorias do lançamento manual. "Débito de cliente" (21/09) juntou
   o que antes eram duas — "Parcelamento de cliente" e "Dívida anterior"
   — numa só, com a opção de pagar de uma vez ou parcelado. Lançamento
   antigo continua com a categoria que tinha: ao editar, ela entra na
   lista, senão o <select> trocaria a categoria sozinho ao salvar. */
const CATEGORIAS_FIN = ["Venda de produto","Compra de estoque","Débito de cliente","Despesa fixa","Despesa variável","Outro"];
const CATEGORIAS_COM_CLIENTE = ["Débito de cliente","Dívida anterior"];

  if(existing && existing.parcelamentoId){
    const cli=getCliente(clienteIdDe(existing)), parcelas=db.financeiro.filter(f=>f.parcelamentoId===existing.parcelamentoId);
    openSheet(`Parcela ${existing.parcelaNumero}/${existing.totalParcelas}`, `
      <p class="hint"><b>${esc(cli?cli.nome:"Cliente removido")}</b> · ${esc(existing.frequencia||"recorrente")} · ${parcelas.filter(f=>!f.liquidado).length} parcela(s) em aberto de ${parcelas.length}.</p>
      <div class="field-row">
        <div class="field"><label>Vencimento</label><input id="f-pvenc" type="date" value="${existing.vencimento||existing.data}" ${existing.liquidado?"disabled":""}></div>
        <div class="field"><label>Valor</label><input id="f-pvalor" type="number" min="0" step="0.01" value="${existing.valor??""}" ${existing.liquidado?"disabled":""}></div>
      </div>
      ${existing.liquidado?`<p class="hint">Recebida em ${fmtDate(existing.liquidadoEm)} — data e valor ficam travados pra não desencontrar do que já entrou no caixa. Se marcou sem querer, desfaça abaixo.</p>`:`<p class="hint">Mudar o valor desta parcela não redistribui as outras — se o total combinado deixar de bater, é pra ajustar na mão.</p>`}
      <div class="btnrow">
        <button class="btn ghost" id="cancel">Voltar</button>
        ${existing.liquidado?`<button class="btn outline" id="desfazer">Desfazer recebimento</button>`:`<button class="btn primary" id="save-parcela">Salvar</button>`}
      </div>
      <button class="btn danger" id="del-parcela" style="width:100%;margin-top:10px">Excluir esta parcela</button>
      <button class="btn danger" id="del-plan" style="width:100%;margin-top:10px">Excluir todas as parcelas deste combinado</button>
    `, root=>{
      root.querySelector("#cancel").addEventListener("click",closeSheet);
      const desfazerBtn = root.querySelector("#desfazer");
      if(desfazerBtn) desfazerBtn.addEventListener("click", ()=>{ closeSheet(); desfazerLiquidacao(existing.id); });
      const saveBtn = root.querySelector("#save-parcela");
      if(saveBtn) saveBtn.addEventListener("click",()=>{
        const venc = root.querySelector("#f-pvenc").value;
        const valor = Number(root.querySelector("#f-pvalor").value)||0;
        if(!venc){ alert("Informe o vencimento."); return; }
        if(valor<=0){ alert("Informe um valor maior que zero."); return; }
        existing.vencimento = venc;
        existing.data = venc;
        existing.valor = valor;
        saveDB(); closeSheet(); toast("Parcela atualizada"); render();
      });
      root.querySelector("#del-parcela").addEventListener("click",()=>{
        if(confirm(existing.liquidado ? "Essa parcela já foi recebida — excluir mesmo assim? Ela some do histórico." : "Excluir esta parcela?")){
          db.financeiro=db.financeiro.filter(f=>f.id!==existing.id);
          saveDB(); closeSheet(); toast("Parcela excluída"); render();
        }
      });
      root.querySelector("#del-plan").addEventListener("click",()=>{ if(confirm("Excluir todas as parcelas deste combinado? As já recebidas também serão removidas do histórico.")){ db.financeiro=db.financeiro.filter(f=>f.parcelamentoId!==existing.parcelamentoId); saveDB(); closeSheet(); toast("Parcelamento excluído"); render(); } });
    });
    return;
  }
  const v = existing || {data:todayISO(), tipo:"Entrada", categoria:"Venda de produto", formaPagamento:"Pix"};
  const categorias = CATEGORIAS_FIN.includes(v.categoria) ? CATEGORIAS_FIN : [...CATEGORIAS_FIN, v.categoria];
  let compraItens=itensCompra(v).map(i=>({...i}));
  openSheet(isEdit?"Editar lançamento":"Novo lançamento", `
    <div class="field"><label for="f-cat">Categoria</label><select id="f-cat">${categorias.map(o=>`<option ${v.categoria===o?"selected":""}>${o}</option>`).join("")}</select></div>

    <div class="field-row" id="topo-box">
      <div class="field"><label for="f-data">Data</label><input id="f-data" type="date" value="${v.data}"></div>
      <div class="field"><label for="f-tipo">Tipo</label><select id="f-tipo">${["Entrada","Saída"].map(o=>`<option ${v.tipo===o?"selected":""}>${o}</option>`).join("")}</select></div>
    </div>

    <div id="compra-box" style="display:none">
      <div class="field"><label>Itens que entraram</label><div id="compra-itens"></div><button class="btn ghost" type="button" id="add-compra" style="width:100%;margin-top:8px">+ Adicionar produto</button></div>
      <p class="hint">Cada item entra no Estoque ao salvar. O custo de cada um forma o valor total desta compra.</p>
    </div>

    ${isEdit ? "" : `<div id="debito-box" style="display:none">${camposDebitoHTML(null, false)}</div>`}

    <div id="cli-box" style="display:none">
      <div class="field"><label for="f-cli">Cliente</label><select id="f-cli">${clienteOptions(clienteIdDe(v))}</select></div>
    </div>

    <div id="generico-box">
    <div class="field"><label for="f-desc">Descrição</label><input id="f-desc" value="${esc(v.descricao||"")}"></div>
    <div class="field-row">
      <div class="field"><label for="f-valor">Valor</label><input id="f-valor" type="number" inputmode="decimal" min="0" step="0.01" value="${v.valor??""}"></div>
      <div class="field"><label for="f-pag">Forma de pagamento</label><select id="f-pag">${["Pix","Dinheiro","Cartão","Boleto","Transferência"].map(o=>`<option ${v.formaPagamento===o?"selected":""}>${o}</option>`).join("")}</select></div>
    </div>

    <div class="field"><label for="f-liq">O dinheiro já entrou/saiu?</label>
      <select id="f-liq">
        <option value="sim" ${(v.liquidado===false)?"":"selected"}>Sim, já foi</option>
        <option value="nao" ${(v.liquidado===false)?"selected":""}>Ainda não — está em aberto</option>
      </select>
    </div>
    <div class="field" id="venc-box" style="display:none">
      <label for="f-venc">Combinado para</label>
      <input id="f-venc" type="date" value="${v.vencimento||""}">
    </div>
    <p class="hint" id="liq-hint"></p>
    </div>

    ${v.pedidoId?`<p class="hint">Lançado sozinho a partir de um pedido entregue. Pra mudar valor ou data, edite o pedido — excluir o pedido remove esse lançamento junto.</p>`:""}
    <div class="btnrow">
      <button class="btn ghost" id="cancel">Cancelar</button>
      <button class="btn primary" id="save" ${v.pedidoId?"disabled":""}>${isEdit?"Salvar":"Lançar"}</button>
    </div>
    ${v.pedidoId && v.liquidado?`<button class="btn outline" style="width:100%;margin-top:10px" id="desfazer">Desfazer recebimento</button>`:""}
    ${isEdit && !v.pedidoId?`<button class="btn danger" style="width:100%;margin-top:10px" id="del">Excluir lançamento</button>`:""}
  `, root=>{
    root.querySelector("#cancel").addEventListener("click", closeSheet);
    const catEl = root.querySelector("#f-cat"), tipoEl = root.querySelector("#f-tipo"),
          compraWrap = root.querySelector("#compra-box"), debitoBox = root.querySelector("#debito-box"),
          cliBox = root.querySelector("#cli-box"), topoBox = root.querySelector("#topo-box"),
          genericoBox = root.querySelector("#generico-box"), valorEl = root.querySelector("#f-valor"),
          compraBox = root.querySelector("#compra-itens"),
          liqEl = root.querySelector("#f-liq"), vencBox = root.querySelector("#venc-box"),
          liqHint = root.querySelector("#liq-hint");
    const debito = debitoBox ? ligarDebito(debitoBox, null) : null;

    const desfazerBtn = root.querySelector("#desfazer");
    if(desfazerBtn) desfazerBtn.addEventListener("click", ()=>{ closeSheet(); desfazerLiquidacao(v.id); });

    function renderCompraItens(){
      compraBox.innerHTML=compraItens.map((i,n)=>`<div class="card" style="cursor:default;padding:12px;margin:8px 0"><div class="field"><label>Produto</label><select data-cprod="${n}"><option value="">— selecione —</option>${produtoOptions(i.produtoId)}</select></div><div class="field-row"><div class="field"><label>Quantidade</label><input data-cqtd="${n}" type="number" min="1" value="${i.qtd??1}"></div><div class="field"><label>Custo unitário</label><input data-ccusto="${n}" type="number" min="0" step="0.01" value="${i.custoUnit??""}"></div></div>${compraItens.length>1?`<button class="btn ghost" type="button" data-crem="${n}" style="width:100%;margin-top:4px">Remover item</button>`:""}</div>`).join("");
      compraBox.querySelectorAll("[data-cprod]").forEach(el=>el.addEventListener("change",()=>{ const i=compraItens[el.dataset.cprod],e=getProduto(el.value); i.produtoId=el.value; i.produto=e?e.produto:""; i.custoUnit=e?(Number(e.custoUnit)||0):0; renderCompraItens(); atualizaCompraTotal(); }));
      compraBox.querySelectorAll("[data-cqtd]").forEach(el=>el.addEventListener("input",()=>{ compraItens[el.dataset.cqtd].qtd=Number(el.value)||0; atualizaCompraTotal(); }));
      compraBox.querySelectorAll("[data-ccusto]").forEach(el=>el.addEventListener("input",()=>{ compraItens[el.dataset.ccusto].custoUnit=Number(el.value)||0; atualizaCompraTotal(); }));
      compraBox.querySelectorAll("[data-crem]").forEach(el=>el.addEventListener("click",()=>{ compraItens.splice(Number(el.dataset.crem),1); renderCompraItens(); atualizaCompraTotal(); }));
    }
    function atualizaCompraTotal(){ valorEl.value=compraItens.reduce((s,i)=>s+(Number(i.qtd)||0)*(Number(i.custoUnit)||0),0).toFixed(2); }
    root.querySelector("#add-compra").addEventListener("click",()=>{ const e=db.estoque[0]; if(!e){ alert("Cadastre um produto no Estoque primeiro."); return; } compraItens.push({produtoId:e.id,produto:e.produto,qtd:1,custoUnit:Number(e.custoUnit)||0}); renderCompraItens(); atualizaCompraTotal(); });
    renderCompraItens();

    /* Conta em aberto não entra no saldo — o campo de data só aparece
       quando faz sentido combinar um prazo. */
    function toggleLiquidado(){
      const emAberto = liqEl.value==="nao";
      vencBox.style.display = emAberto ? "block" : "none";
      liqHint.textContent = emAberto
        ? (tipoEl.value==="Entrada"
            ? "Vai aparecer em “a receber” e só entra no saldo quando você marcar como recebido."
            : "Vai aparecer em “a pagar” e só sai do saldo quando você marcar como pago.")
        : "";
    }

    /* Cada categoria mostra só o que ela usa. Débito de cliente novo tem
       o formulário próprio (o mesmo da ficha do cliente); editando um
       débito já lançado, vale o formulário comum com o cliente em cima. */
    function atualizarCategoria(){
      const cat = catEl.value;
      const ehCompra = cat==="Compra de estoque";
      const ehDebitoNovo = !isEdit && cat==="Débito de cliente";
      compraWrap.style.display = ehCompra ? "block" : "none";
      if(debitoBox) debitoBox.style.display = ehDebitoNovo ? "block" : "none";
      genericoBox.style.display = ehDebitoNovo ? "none" : "block";
      topoBox.style.display = ehDebitoNovo ? "none" : "grid";
      cliBox.style.display = (isEdit && CATEGORIAS_COM_CLIENTE.includes(cat)) ? "block" : "none";
      if(ehCompra) tipoEl.value = "Saída";
      if(CATEGORIAS_COM_CLIENTE.includes(cat)) tipoEl.value = "Entrada";
      valorEl.readOnly = ehCompra;
      if(ehCompra) atualizaCompraTotal();
      toggleLiquidado();
    }
    catEl.addEventListener("change", atualizarCategoria);
    liqEl.addEventListener("change", toggleLiquidado);
    tipoEl.addEventListener("change", toggleLiquidado);
    atualizarCategoria();

    const delBtn = root.querySelector("#del");
    if(delBtn) delBtn.addEventListener("click", ()=>{
      const temEstoque = itensCompra(existing).some(i=>Number(i.qtd)>0);
      if(confirm(temEstoque
        ? "Excluir esse lançamento? A quantidade que ele tinha colocado no estoque será removida de volta."
        : "Excluir esse lançamento?")){
        reconciliarEstoqueCompra(existing, null);
        db.financeiro = db.financeiro.filter(f=>f.id!==existing.id);
        saveDB(); closeSheet(); toast("Lançamento excluído"); render();
      }
    });
    root.querySelector("#save").addEventListener("click", ()=>{
      if(debito && catEl.value==="Débito de cliente"){
        const r = debito.salvar();
        if(!r) return;
        state.finMes = r.ym; saveDB(); closeSheet(); toast(r.msg); render(); return;
      }
      const ehCompra = catEl.value==="Compra de estoque";
      const temCliente = CATEGORIAS_COM_CLIENTE.includes(catEl.value);
      const clienteId = temCliente ? root.querySelector("#f-cli").value : null;
      if(temCliente && !clienteId){ alert("Escolha o cliente."); return; }
      const valor = Number(valorEl.value)||0;
      if(valor<=0){ alert("Informe um valor maior que zero."); return; }
      const itensValidos=ehCompra?compraItens.filter(i=>i.produtoId&&Number(i.qtd)>0):[];
      if(ehCompra && (!itensValidos.length || itensValidos.length!==compraItens.length)){ alert("Escolha produto e quantidade para todos os itens da compra."); return; }
      const rec = {
        id: existing?existing.id:uid(),
        data: root.querySelector("#f-data").value || todayISO(),
        tipo: tipoEl.value,
        categoria: catEl.value,
        descricao: root.querySelector("#f-desc").value.trim(),
        valor,
        formaPagamento: root.querySelector("#f-pag").value,
        pedidoId: v.pedidoId || null,
        clienteId,
        obs: v.obs||"",
        itensEstoque: ehCompra ? itensValidos.map(i=>({...i,qtd:Number(i.qtd)||0,custoUnit:Number(i.custoUnit)||0})) : [],
        liquidado: liqEl.value==="sim",
        liquidadoEm: liqEl.value==="sim" ? ((existing && existing.liquidado && existing.liquidadoEm) || root.querySelector("#f-data").value || todayISO()) : null,
        vencimento: liqEl.value==="nao" ? (root.querySelector("#f-venc").value || null) : null,
      };

      reconciliarEstoqueCompra(existing || null, rec);

      if(isEdit){ db.financeiro = db.financeiro.map(f=>f.id===rec.id?rec:f); }
      else{ db.financeiro.push(rec); }
      // lançamento com data de outro mês sumiria da tela; leva a visão junto
      state.finMes = rec.data.slice(0,7);
      saveDB(); closeSheet();
      toast(rec.itensEstoque.length ? "Lançado — estoque atualizado" : (isEdit?"Lançamento atualizado":"Lançamento criado"));
      render();
    });
  });
}

/* ---------- FAB por view ---------- */
function renderFab(){
  const old = document.getElementById("fab-btn");
  if(old) old.remove();
  const map = {
    clientes: ["Cliente", ()=>openClienteForm()],
    pedidos: ["Pedido", ()=>openPedidoForm()],
    followup: ["Follow-up", ()=>openFollowForm()],
    estoque: ["Produto", ()=>openEstoqueForm()],
    financeiro: ["Lançamento", ()=>openFinanceiroForm()],
  };
  const item = map[state.view];
  if(!item) return;
  const [rotulo, action] = item;
  const btn = document.createElement("button");
  btn.className = "fab"; btn.id = "fab-btn"; btn.setAttribute("aria-label", `Adicionar ${rotulo.toLowerCase()}`);
  btn.innerHTML = `${ICONS.plus}<span>${rotulo}</span>`;
  btn.addEventListener("click", action);
  document.body.appendChild(btn);
}

const _origRender = render;
render = function(){ _origRender(); renderFab(); };

render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* app continua funcionando sem SW, so perde o cache offline do shell */ });
  });
}
</script>
</body>
</html>
