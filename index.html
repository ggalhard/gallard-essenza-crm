/* ============================================================
   TOKENS — os dois registros da própria marca Gallard Essenza:
   claro = "registro do dia a dia" (creme), escuro = "registro
   formal" (preto+dourado, o mesmo do medalhão). Não é inversão
   genérica de dark mode — é a marca já tendo duas vozes prontas.
   ============================================================ */
:root{
  --surface:#F8F1E4;
  --surface-card:#EFE4D2;
  --surface-card-2:#E6D9C2;
  --ink:#2B231A;
  --ink-soft:#7A6A50;
  --ink-faint:#a08e6f;
  --gold:#9C8A6E;
  --gold-deep:#7A6A50;
  --gold-bright:#8f7a54;
  --border:#DDCEB0;
  --bar-bg:#0D0C0A;
  --bar-ink:#F3E9DC;
  --ok:#4c6b4c;
  --ok-bg:#e2ebe0;
  --warn:#9c5f22;
  --warn-bg:#f3e3cc;
  --critical:#963b34;
  --critical-bg:#f4dcd8;
  --shadow:0 1px 2px rgba(43,35,26,.06), 0 4px 14px rgba(43,35,26,.07);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#0D0C0A;
    --surface-card:#1C1815;
    --surface-card-2:#26201B;
    --ink:#F3E9DC;
    --ink-soft:#C9BBA0;
    --ink-faint:#8a7a63;
    --gold:#C9BBA0;
    --gold-deep:#9C8A6E;
    --gold-bright:#e2d5b8;
    --border:#3a3129;
    --bar-bg:#000000;
    --bar-ink:#F3E9DC;
    --ok:#8fae87;
    --ok-bg:#20291f;
    --warn:#d99a55;
    --warn-bg:#2e2214;
    --critical:#e08a80;
    --critical-bg:#301c19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --surface:#0D0C0A;
  --surface-card:#1C1815;
  --surface-card-2:#26201B;
  --ink:#F3E9DC;
  --ink-soft:#C9BBA0;
  --ink-faint:#8a7a63;
  --gold:#C9BBA0;
  --gold-deep:#9C8A6E;
  --gold-bright:#e2d5b8;
  --border:#3a3129;
  --bar-bg:#000000;
  --bar-ink:#F3E9DC;
  --ok:#8fae87;
  --ok-bg:#20291f;
  --warn:#d99a55;
  --warn-bg:#2e2214;
  --critical:#e08a80;
  --critical-bg:#301c19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:500}
p{margin:0}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

.brand{
  font-family:'Cinzel',serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.14em;
}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.serif-i{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app-shell{
  display:flex;flex-direction:column;min-height:100vh;max-width:560px;margin:0 auto;
  background:var(--surface);
}
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--bar-bg);color:var(--bar-ink);
  padding:14px 18px 12px;
  display:flex;flex-direction:column;gap:2px;
  border-bottom:1px solid rgba(201,187,160,.25);
}
.topbar .wordmark{font-size:15px;color:var(--gold-bright, #C9BBA0)}
.topbar .screen-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;color:var(--bar-ink)}
.topbar .screen-sub{font-size:12.5px;color:#C9BBA0;opacity:.85}

.content{flex:1;padding:16px 16px 96px;overflow-y:auto}
.content.no-pad{padding-left:0;padding-right:0}

.tabbar{
  position:sticky;bottom:0;z-index:20;
  display:flex;background:var(--bar-bg);
  border-top:1px solid rgba(201,187,160,.25);
  padding-bottom:env(safe-area-inset-bottom,0);
}
.tabbtn{
  flex:1;background:none;border:none;padding:9px 4px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#a8987e;font-size:10.5px;letter-spacing:.02em;
}
.tabbtn .ic{width:22px;height:22px;display:block}
.tabbtn[aria-current="true"]{color:var(--bar-ink)}
.tabbtn[aria-current="true"] .ic{color:var(--gold-bright,#C9BBA0)}

/* ---------- cards / lists ---------- */
.section-label{
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);margin:22px 2px 10px;
}
.section-label:first-child{margin-top:2px}

/* navegador de mês do Financeiro */
.mesnav{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--surface-card);border-radius:var(--radius);
  padding:8px 8px;box-shadow:var(--shadow);margin-bottom:12px;
}
.mesnav button{
  flex:0 0 auto;width:40px;height:40px;border:0;border-radius:12px;
  background:var(--surface-card-2);color:var(--ink);font-size:20px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.mesnav button:disabled{opacity:.3;cursor:default}
.mesnav .rotulo{
  flex:1;text-align:center;font-weight:600;font-size:15px;
}
.mesnav .rotulo small{
  display:block;font-size:11px;font-weight:500;color:var(--ink-faint);
  text-transform:none;letter-spacing:.04em;margin-top:1px;
}

/* linha de categoria com barra proporcional */

<body>

<div id="app-shell">
  <div class="topbar">
    <div class="wordmark brand">Gallard Essenza</div>
    <div class="screen-title" id="screen-title">Início</div>
    <div class="screen-sub" id="screen-sub"></div>
  </div>
  <div class="content" id="content"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DADOS — tudo fica só nesse aparelho (localStorage). Sem
   chamada de rede em runtime nenhuma: depois que a página carrega
   uma vez, continua funcionando se a internet cair no meio do uso.
   ============================================================ */
const DB_KEY = "gallard-crm-db-v1";
const SCHEMA = 3;
const EMPTY_DB = { schema: SCHEMA, clientes: [], pedidos: [], followups: [], estoque: [], financeiro: [] };

/* Compara texto ignorando acento e caixa — "mascara reconstrucao" e
   "Máscara Reconstrução" viram a mesma coisa. Usado só na migração,
   pra reaproveitar o que foi digitado à mão antes do vínculo existir. */
function normalizar(s){
  return (s??"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}

/* Sobe o banco antigo (schema 1) pro novo sem perder nada:
   - cliente.bairro vira cliente.rua
   - pedido.produto (texto livre) tenta achar o produto no estoque pelo nome;
     se achar, vira pedido.produtoId. Se não achar, o texto continua lá e o
     pedido aparece marcado como "produto fora do estoque" na tela.
   - marca os pedidos já entregues como estoqueBaixado, senão a primeira
     reconciliação devolveria quantidade que nunca saiu. */
function migrar(dbv){
  const de = Number(dbv.schema)||1;
  if(de >= SCHEMA) return dbv;

  // ---- schema 2 -> 3: separa "aconteceu" de "o dinheiro entrou" ----
  // Antes, todo lançamento contava no saldo na hora. Como entrega e
  // recebimento podem ser em dias diferentes, agora existe `liquidado`.
  // Tudo que já existia contava no saldo, então entra como liquidado.
  if(de >= 2){
    (dbv.financeiro||[]).forEach(f=>{
      if(f.liquidado === undefined){
        f.liquidado = true;
        f.liquidadoEm = f.data;
        f.vencimento = null;
      }
    });
    dbv.schema = SCHEMA;
    return dbv;
  }

  (dbv.clientes||[]).forEach(c=>{
    if(c.bairro !== undefined){
      if(!c.rua) c.rua = c.bairro;
      delete c.bairro;
    }
  });

  (dbv.pedidos||[]).forEach(p=>{
    if(!p.produtoId && p.produto){
      const achado = (dbv.estoque||[]).find(e=> normalizar(e.produto) === normalizar(p.produto));
      if(achado) p.produtoId = achado.id;
    }
    if(p.custoUnit === undefined){
      const e = (dbv.estoque||[]).find(x=>x.id===p.produtoId);
      p.custoUnit = e ? (Number(e.custoUnit)||0) : 0;
    }
    // pedidos entregues antes da migração já saíram fisicamente do estoque;
    // registrar isso evita que a primeira edição devolva quantidade fantasma
    if(p.estoqueBaixado === undefined){
      p.estoqueBaixado = false;
      p.qtdBaixada = 0;
    }
  });

  (dbv.financeiro||[]).forEach(f=>{
    if(f.estoqueId === undefined){ f.estoqueId = null; f.qtdEntrada = 0; }
    // vindo do schema 1, tudo que existe já era contado no saldo
    if(f.liquidado === undefined){
      f.liquidado = true;
      f.liquidadoEm = f.data;
      f.vencimento = null;
    }
  });

  dbv.schema = SCHEMA;
  return dbv;
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return structuredClone(EMPTY_DB);
    const parsed = JSON.parse(raw);
    const merged = Object.assign(structuredClone(EMPTY_DB), parsed);
    // o EMPTY_DB já vem com schema atual; se o banco salvo não tem a chave,
    // o merge herdaria a versão nova e a migração seria pulada. Banco sem
    // `schema` é, por definição, o formato 1.
    merged.schema = Number(parsed.schema) || 1;
    return migrar(merged);
  }catch(e){ return structuredClone(EMPTY_DB); }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
let db = loadDB();

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function fmtMoney(v){
  const n = Number(v)||0;
  return n.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
}
function daysSince(iso){
  if(!iso) return null;
  const a = new Date(iso+"T00:00:00");
  const b = new Date(todayISO()+"T00:00:00");
  return Math.round((b-a)/86400000);
}
function getCliente(id){ return db.clientes.find(c=>c.id===id); }
function getProduto(id){ return db.estoque.find(e=>e.id===id); }

/* ============================================================
   ESTOQUE — o vínculo que faltava entre venda, estoque e caixa.

   Regra: a quantidade em `estoque.qtd` é o que existe FISICAMENTE na
   prateleira. Ela só muda em três situações, todas reconciliadas aqui:

   1. pedido vira "Entregue"  → sai do estoque (produto foi entregue)
   2. lançamento de "Compra de estoque" no Financeiro → entra no estoque
   3. ajuste manual pelos botões +/− da tela de Estoque

   Pedido "Pendente" NÃO baixa estoque — ele fica *comprometido*: já foi
   prometido a alguém, mas ainda não saiu. Por isso existe `disponivel()`,
   que é o que realmente dá pra vender sem furar promessa.
   ============================================================ */

/* Quanto de um produto está prometido em pedidos ainda não entregues. */
function comprometido(produtoId, ignorarPedidoId){
  return db.pedidos
    .filter(p=> p.produtoId===produtoId && p.status==="Pendente" && p.id!==ignorarPedidoId)
    .reduce((s,p)=> s + (Number(p.qtd)||0), 0);
}

/* O que dá pra vender agora: prateleira menos o que já foi prometido. */
function disponivel(produtoId, ignorarPedidoId){
  const e = getProduto(produtoId);
  if(!e) return 0;
  return (Number(e.qtd)||0) - comprometido(produtoId, ignorarPedidoId);
}

/* Reconcilia a baixa de estoque de um pedido.

   Sempre devolve o que esse pedido já tinha tirado antes (se tirou) e só
   então aplica a baixa nova. Fazer nessa ordem é o que faz funcionar
   quando o pedido é editado — trocar o produto, mudar a quantidade ou
   voltar de "Entregue" pra "Pendente" ficam todos corretos, sem precisar
   de um caso especial pra cada um. */
function reconciliarEstoquePedido(anterior, atual){
  if(anterior && anterior.estoqueBaixado){
    const e = getProduto(anterior.produtoId);
    if(e) e.qtd = (Number(e.qtd)||0) + (Number(anterior.qtdBaixada)||0);
  }
  if(!atual) return;

  const e = getProduto(atual.produtoId);
  if(atual.status==="Entregue" && e){
    e.qtd = (Number(e.qtd)||0) - (Number(atual.qtd)||0);
    e.atualizadoEm = todayISO();
    atual.estoqueBaixado = true;
    atual.qtdBaixada = Number(atual.qtd)||0;
  }else{
    atual.estoqueBaixado = false;
    atual.qtdBaixada = 0;
  }
}

/* Mesma ideia pro caminho inverso: lançamento de "Compra de estoque" no
   Financeiro entra como quantidade na prateleira. */
function reconciliarEstoqueCompra(anterior, atual){
  if(anterior && anterior.estoqueId && anterior.qtdEntrada){
    const e = getProduto(anterior.estoqueId);
    if(e) e.qtd = (Number(e.qtd)||0) - (Number(anterior.qtdEntrada)||0);
  }
  if(!atual) return;

  const e = getProduto(atual.estoqueId);
  if(atual.categoria==="Compra de estoque" && e && Number(atual.qtdEntrada)>0){
    e.qtd = (Number(e.qtd)||0) + (Number(atual.qtdEntrada)||0);
    e.atualizadoEm = todayISO();
  }else{
    atual.estoqueId = null;
    atual.qtdEntrada = 0;
  }
}
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------- KPIs ---------- */
function computeKPIs(){
  const clientesAtivos = db.clientes.filter(c=>c.status==="Ativo").length;
  const leadsNovos = db.clientes.filter(c=>c.status==="Lead novo").length;
  const ym = todayISO().slice(0,7);
  const pedidosMes = db.pedidos.filter(p=>(p.data||"").slice(0,7)===ym);
  // pedido cancelado não é faturamento — contar ele inflava o número e fazia
  // o painel mostrar dinheiro que nunca entrou (corrigido em 2026-08-18)
  const pedidosMesValidos = pedidosMes.filter(p=>p.status!=="Cancelado");
  const faturamentoMes = pedidosMesValidos.reduce((s,p)=>s+(Number(p.qtd)||0)*(Number(p.valorUnit)||0),0);
  const custoMes = pedidosMesValidos.reduce((s,p)=>s+(Number(p.qtd)||0)*(Number(p.custoUnit)||0),0);
  const lucroMes = faturamentoMes - custoMes;
  // "baixo" agora olha o disponível (prateleira − prometido), não só a
  // prateleira: 8 na estante com 6 já prometidos é estoque baixo de verdade
  // produto prometido além do que existe — furo de estoque a caminho
  const estoqueNegativo = db.estoque.filter(e=> disponivel(e.id) < 0);
  // "baixo" exclui os que já estão no alerta de furo, pra não avisar duas
  // vezes do mesmo produto no painel
  const estoqueBaixo = db.estoque.filter(e=> disponivel(e.id) >= 0 && disponivel(e.id) <= Number(e.minimo));
  const valorEstoque = db.estoque.reduce((s,e)=> s + (Number(e.qtd)||0)*(Number(e.custoUnit)||0), 0);
  const followupsPendentes = db.followups.filter(f=>f.status==="Pendente");
  const followupsAtrasados = followupsPendentes.filter(f=>{
    const d = daysSince(f.ultimaInteracao);
    return d!==null && d>7;
  });
  // Saldo é DINHEIRO EM CAIXA: só conta o que foi de fato recebido/pago.
  // Venda entregue mas ainda não paga não entra aqui — ela aparece em
  // "a receber", senão o saldo mostraria dinheiro que ainda não chegou.
  const saldo = db.financeiro
    .filter(f=>f.liquidado)
    .reduce((s,f)=> s + (f.tipo==="Entrada"? Number(f.valor)||0 : -(Number(f.valor)||0)), 0);

  const pendentes = db.financeiro.filter(f=>!f.liquidado);
  const aReceberLista = pendentes.filter(f=>f.tipo==="Entrada");
  const aPagarLista = pendentes.filter(f=>f.tipo==="Saída");
  const aReceber = aReceberLista.reduce((s,f)=>s+(Number(f.valor)||0),0);
  const aPagar = aPagarLista.reduce((s,f)=>s+(Number(f.valor)||0),0);
  const hoje = todayISO();
  const vencidos = aReceberLista.filter(f=> f.vencimento && f.vencimento < hoje);
  const venceHoje = aReceberLista.filter(f=> f.vencimento === hoje);
  const aReceberVencido = vencidos.reduce((s,f)=>s+(Number(f.valor)||0),0);
  return {clientesAtivos, leadsNovos, pedidosMes, pedidosMesValidos, faturamentoMes,
          custoMes, lucroMes, estoqueBaixo, estoqueNegativo, valorEstoque,
          followupsPendentes, followupsAtrasados, saldo,
          aReceber, aReceberLista, aPagar, aPagarLista,
          vencidos, venceHoje, aReceberVencido};
}

/* ============================================================
   FINANCEIRO POR MÊS

   Os lançamentos sempre tiveram data, mas a tela mostrava tudo numa
   lista só, com um saldo geral — dava pra saber quanto tem no caixa,
   não como o mês foi. Aqui ficam as contas por competência mensal.
   ============================================================ */

const MESES = ["janeiro","fevereiro","março","abril","maio","junho",
               "julho","agosto","setembro","outubro","novembro","dezembro"];

function ymAtual(){ return todayISO().slice(0,7); }

function nomeMes(ym, capitalizado){
  const [a,m] = ym.split("-");
  const nome = MESES[Number(m)-1];
  // capitaliza só a primeira letra aqui, no lugar de usar
  // text-transform:capitalize no CSS — que deixaria "Agosto De 2026"
  return `${capitalizado ? nome[0].toUpperCase()+nome.slice(1) : nome} de ${a}`;
}

/* Anda pra frente ou pra trás sem depender de Date (que tropeça em
   virada de ano e fuso). */
function deslocaMes(ym, delta){
  let [a,m] = ym.split("-").map(Number);
  m += delta;
  while(m < 1){ m += 12; a--; }
  while(m > 12){ m -= 12; a++; }
  return `${a}-${String(m).padStart(2,"0")}`;
}

/* Fecha o mês: entradas, saídas, resultado e o saldo acumulado até o
   último dia dele — o acumulado é o que responde "quanto eu tinha em
   caixa no fim daquele mês", diferente do resultado isolado. */
function resumoMes(ym){
  const doMes = db.financeiro.filter(f => (f.data||"").slice(0,7) === ym);
  const soma = arr => arr.reduce((s,f)=>s+(Number(f.valor)||0),0);

  // "Entrou"/"Saiu" é dinheiro que se moveu de verdade. O que foi
  // entregue mas ainda não foi pago fica separado, em a receber.
  const entradas = soma(doMes.filter(f=>f.tipo==="Entrada" && f.liquidado));
  const saidas   = soma(doMes.filter(f=>f.tipo==="Saída"   && f.liquidado));
  const aReceberMes = soma(doMes.filter(f=>f.tipo==="Entrada" && !f.liquidado));
  const aPagarMes   = soma(doMes.filter(f=>f.tipo==="Saída"   && !f.liquidado));

  const acumulado = db.financeiro
    .filter(f => f.liquidado && (f.data||"").slice(0,7) <= ym)
    .reduce((s,f)=> s + (f.tipo==="Entrada" ? Number(f.valor)||0 : -(Number(f.valor)||0)), 0);

  // agrupa por categoria, separando o que entrou do que saiu
  const porCategoria = (tipo)=>{
    const mapa = {};
    doMes.filter(f=>f.tipo===tipo && f.liquidado).forEach(f=>{
      const cat = f.categoria || "Outro";
      mapa[cat] = (mapa[cat]||0) + (Number(f.valor)||0);
    });
    return Object.entries(mapa).sort((a,b)=> b[1]-a[1]);
  };

  return {
    ym, lancamentos: doMes, entradas, saidas, aReceberMes, aPagarMes,
    resultado: entradas - saidas,
    acumulado,
    entradasPorCategoria: porCategoria("Entrada"),
    saidasPorCategoria: porCategoria("Saída"),
  };
}

/* Meses que têm algum lançamento — usado pra dizer se vale oferecer
   navegação e pra montar o histórico. */

  return [...new Set(db.financeiro.map(f=>(f.data||"").slice(0,7)).filter(Boolean))].sort();
}

function pedidoCard(p){
  const cl = getCliente(p.clienteId);
  const total = (Number(p.qtd)||0)*(Number(p.valorUnit)||0);
  const custo = (Number(p.qtd)||0)*(Number(p.custoUnit)||0);
  const map = {"Pendente":"warn","Entregue":"ok","Cancelado":"critical"};
  // pedido antigo (antes do vínculo com estoque) ou produto excluído depois
  const semVinculo = !p.produtoId || !getProduto(p.produtoId);
  // entregue mas ainda não pago — o lançamento ligado a ele não liquidou
  const fin = db.financeiro.find(f=>f.pedidoId===p.id);
  const aReceber = p.status==="Entregue" && fin && !fin.liquidado;
  const atrasado = aReceber && p.vencimento && p.vencimento < todayISO();
  return `<button class="card" data-pedido="${p.id}">
    <div class="card-row">
      <div>
        <div class="card-title">${esc(p.produto||"(sem produto)")}</div>
        <div class="card-sub">${cl?esc(cl.nome):"—"} · ${p.qtd} un</div>
      </div>
      <div class="card-right"><div class="card-value tnum">${fmtMoney(total)}</div><span class="badge ${map[p.status]||"neutral"}">${esc(p.status||"—")}</span></div>
    </div>
    ${semVinculo?`<div class="card-meta" style="margin-top:6px"><span style="color:var(--critical)">Sem vínculo com o estoque — abra e escolha o produto</span></div>`:""}
    ${aReceber?`<div class="card-meta" style="margin-top:6px"><span style="color:${atrasado?"var(--critical)":"var(--warn)"}">${atrasado?`a receber — atrasado desde ${fmtDate(p.vencimento)}`:(p.vencimento?`a receber até ${fmtDate(p.vencimento)}`:"a receber — sem data combinada")}</span></div>`:""}
    <div class="card-meta">
      <span>${fmtDate(p.data)}</span>
      ${custo>0 && p.status!=="Cancelado" ? `<span>lucro ${fmtMoney(total-custo)}</span>` : `<span>${esc(p.formaPagamento||"—")}</span>`}
    </div>
  </button>`;
}
function followCard(f){
  const cl = getCliente(f.clienteId);
  const d = daysSince(f.ultimaInteracao);
  const atrasado = f.status==="Pendente" && d!==null && d>7;
  const map = {"Pendente": atrasado?"critical":"warn","Feito":"ok","Sem retorno":"neutral"};
  return `<button class="card" data-follow="${f.id}">
    <div class="card-row">
      <div><div class="card-title">${cl?esc(cl.nome):"—"}</div><div class="card-sub">${esc(f.motivo||"—")}</div></div>
      <span class="badge ${map[f.status]}">${esc(f.status||"—")}</span>
    </div>
    <div class="card-meta">
      <span>${d!==null?d+" dias sem contato":"sem registro"}</span>
      ${f.proximoContato?`<span>próximo: ${fmtDate(f.proximoContato)}</span>`:""}
    </div>
  </button>`;
}

/* ---------- FOLLOW-UP ---------- */
function renderFollowup(c){
  const list = db.followups.slice().sort((a,b)=>{
    const da = daysSince(a.ultimaInteracao) ?? -1, db_ = daysSince(b.ultimaInteracao) ?? -1;
    const pa = a.status==="Pendente", pb = b.status==="Pendente";
    if(pa!==pb) return pa? -1:1;
    return db_-da;
  });
  if(list.length===0){
    c.innerHTML = `<div class="empty"><div class="big">Nenhum follow-up</div><div class="small">Toque no + pra lembrar de retomar contato com alguém.</div></div>`;
    return;
  }
  c.innerHTML = list.map(f=>{
    const cl = getCliente(f.clienteId);
    const d = daysSince(f.ultimaInteracao);
    const atrasado = f.status==="Pendente" && d!==null && d>7;
    const map = {"Pendente": atrasado?"critical":"warn","Feito":"ok","Sem retorno":"neutral"};
    return `<div class="card" data-follow="${f.id}" style="cursor:default">
      <div class="card-row">
        <div><div class="card-title">${cl?esc(cl.nome):"Cliente removido"}</div><div class="card-sub">${esc(f.motivo||"—")}</div></div>
        <span class="badge ${map[f.status]}">${esc(f.status||"—")}</span>
      </div>
      <div class="card-meta">
        <span>${d!==null?d+" dias sem contato":"sem registro"}</span>
        ${f.proximoContato?`<span>próximo: ${fmtDate(f.proximoContato)}</span>`:""}
      </div>
      <div class="detail-actions">
        ${f.status==="Pendente"?`<button class="btn primary" data-done="${f.id}">Marcar feito</button>`:""}
        <button class="btn ghost" data-edit="${f.id}">Editar</button>
      </div>
    </div>`;

/* Ajuste manual (contagem, quebra, perda). Compra pra revenda deve ir pelo
   Financeiro, que lança a despesa junto — por isso o aviso no rodapé da tela. */
function bumpEstoque(id, delta){
  const e = db.estoque.find(x=>x.id===id);
  if(!e) return;
  e.qtd = Math.max(0, (Number(e.qtd)||0) + delta);
  e.atualizadoEm = todayISO();
  saveDB(); renderEstoque(document.getElementById("content"));
}

/* ---------- FINANCEIRO ---------- */
/* Marca uma conta como recebida (ou paga). A data de liquidação é hoje,
   não a data do lançamento — é quando o dinheiro se moveu de verdade. */
function liquidar(id){
  const f = db.financeiro.find(x=>x.id===id);
  if(!f) return;
  f.liquidado = true;
  f.liquidadoEm = todayISO();
  // a partir daqui a data de vencimento não serve mais pra cobrar
  saveDB();
  toast(f.tipo==="Entrada" ? "Recebimento confirmado" : "Pagamento confirmado");
  render();
}

/* Bloco de contas em aberto — fica no topo do Financeiro porque é a
   pergunta mais frequente do dia ("quem ainda me deve?"), e porque não
   pertence a um mês só: vence quando vence. */
function blocoEmAberto(){
  const k = computeKPIs();
  if(k.aReceberLista.length===0 && k.aPagarLista.length===0) return "";
  const hoje = todayISO();

  const linha = (f)=>{
    const cli = f.pedidoId ? getCliente((db.pedidos.find(p=>p.id===f.pedidoId)||{}).clienteId) : null;
    const venc = f.vencimento;
    const atrasado = venc && venc < hoje;
    const hojeMesmo = venc === hoje;
    const dias = venc ? daysSince(venc) : null;
    const quando = !venc ? "sem data combinada"
      : atrasado ? `atrasado ${dias} dia${dias>1?"s":""} — venceu ${fmtDate(venc)}`
      : hojeMesmo ? "vence hoje"
      : `vence ${fmtDate(venc)}`;
    return `<div class="card" style="cursor:default">
      <div class="card-row">
        <div>
          <div class="card-title" style="font-family:inherit;font-size:15px;font-weight:600">${esc(cli?cli.nome:(f.descricao||f.categoria))}</div>
          <div class="card-sub">${esc(cli ? (f.descricao||"").split(" — ")[0] : (f.categoria||"—"))}</div>
        </div>
        <div class="card-value tnum" style="color:${f.tipo==='Entrada'?'var(--ok)':'var(--critical)'}">${fmtMoney(f.valor)}</div>
      </div>
      <div class="card-row" style="margin-top:10px;align-items:center;gap:10px">
        <span class="badge ${atrasado?"critical":hojeMesmo?"warn":"neutral"}">${quando}</span>
        <button class="btn primary" style="flex:none;padding:8px 14px;font-size:13px" data-liquidar="${f.id}">
          ${f.tipo==="Entrada"?"Recebi":"Paguei"}
        </button>
      </div>
    </div>`;
  };

  // vencido primeiro, depois por data; sem data combinada vai pro fim
  const ordena = (a,b)=>{
    if(!a.vencimento) return 1;
    if(!b.vencimento) return -1;
    return a.vencimento.localeCompare(b.vencimento);
  };

  return `
    ${k.aReceberLista.length ? `
      <div class="section-label" style="display:flex;justify-content:space-between">
        <span>A receber</span>
        <span class="tnum" style="letter-spacing:0;text-transform:none;color:var(--ok)">${fmtMoney(k.aReceber)}</span>
      </div>
      ${k.aReceberVencido>0?`<p class="hint" style="color:var(--critical);margin:-4px 2px 10px">${fmtMoney(k.aReceberVencido)} já passou da data combinada.</p>`:""}
      ${k.aReceberLista.slice().sort(ordena).map(linha).join("")}
    `:""}
    ${k.aPagarLista.length ? `
      <div class="section-label" style="display:flex;justify-content:space-between">
        <span>A pagar</span>
        <span class="tnum" style="letter-spacing:0;text-transform:none;color:var(--critical)">${fmtMoney(k.aPagar)}</span>
      </div>
      ${k.aPagarLista.slice().sort(ordena).map(linha).join("")}
    `:""}
    <div class="divider-orn" style="margin:20px 0 4px"></div>
  `;
}

function catRow(nome, valor, total, cor){
  const pct = total>0 ? Math.round(valor/total*100) : 0;
  return `<div class="catrow">
    <div class="topo"><span class="nome">${esc(nome)}</span><span class="val tnum">${fmtMoney(valor)}</span></div>
    <div class="trilho"><div class="barra" style="width:${pct}%;background:${cor}"></div></div>
  </div>`;
}

function renderFinanceiro(c){
  state.finMes = state.finMes || ymAtual();

  const r = resumoMes(ym);
  const meses = mesesComMovimento();
  const anterior = resumoMes(deslocaMes(ym,-1));

  // primeiro lançamento e depois do mês atual

  const podeVoltar = ym > primeiroMes;
  const podeAvancar = ym < ymAtual();

  const difResultado = r.resultado - anterior.resultado;
  const temAnterior = anterior.lancamentos.length > 0;

  c.innerHTML = `
    ${blocoEmAberto()}

    <div class="mesnav">
      <button id="mes-ant" ${podeVoltar?"":"disabled"} aria-label="Mês anterior">‹</button>
      <div class="rotulo">${nomeMes(ym,true)}<small>${r.lancamentos.length} lançamento(s)</small></div>
      <button id="mes-prox" ${podeAvancar?"":"disabled"} aria-label="Próximo mês">›</button>

      <div class="kpi"><div class="v tnum" style="color:var(--critical)">${fmtMoney(r.saidas)}</div><div class="l">Saiu no mês</div></div>

    ${(r.aReceberMes>0 || r.aPagarMes>0) ? `
      <div class="kpi" style="margin-top:10px">
        <div class="v tnum" style="font-size:22px">${r.aReceberMes>0?fmtMoney(r.aReceberMes):fmtMoney(r.aPagarMes)}</div>
        <div class="l">${r.aReceberMes>0?"vendido nesse mês e ainda não recebido":"lançado nesse mês e ainda não pago"}</div>
      </div>
    `:""}

    <div class="kpi" style="margin-top:10px">
      <div class="v tnum" style="color:${r.resultado>=0?'var(--ok)':'var(--critical)'}">${r.resultado>=0?"+":"−"} ${fmtMoney(Math.abs(r.resultado))}</div>
      <div class="l">Resultado de ${nomeMes(ym).split(" de ")[0]}${temAnterior?` · ${difResultado>=0?"▲":"▼"} ${fmtMoney(Math.abs(difResultado))} vs. mês anterior`:""}</div>
    </div>

    <div class="kpi" style="margin-top:10px">
      <div class="v tnum">${fmtMoney(r.acumulado)}</div>
      <div class="l">Saldo acumulado até o fim desse mês</div>
    </div>

    ${r.entradasPorCategoria.length ? `
      <div class="section-label">De onde veio</div>
      ${r.entradasPorCategoria.map(([cat,val])=> catRow(cat, val, r.entradas, "var(--ok)")).join("")}
    ` : ""}

    ${r.saidasPorCategoria.length ? `
      <div class="section-label">Para onde foi</div>
      ${r.saidasPorCategoria.map(([cat,val])=> catRow(cat, val, r.saidas, "var(--critical)")).join("")}
    ` : ""}

    <div class="section-label">Lançamentos</div>
    <div id="fin-list"></div>
  `;

  c.querySelector("#mes-ant").addEventListener("click", ()=>{ state.finMes = deslocaMes(ym,-1); renderFinanceiro(document.getElementById("content")); });
  c.querySelector("#mes-prox").addEventListener("click", ()=>{ state.finMes = deslocaMes(ym, 1); renderFinanceiro(document.getElementById("content")); });
  c.querySelectorAll("[data-liquidar]").forEach(b=> b.addEventListener("click", ()=> liquidar(b.dataset.liquidar)));

  const box = c.querySelector("#fin-list");
  if(r.lancamentos.length===0){
    box.innerHTML = `<div class="empty" style="padding:26px 12px">
      <div class="small">Nenhum lançamento em ${nomeMes(ym)}.${podeVoltar?" Use a seta pra ver um mês anterior.":" Toque no + pra lançar o primeiro."}</div>
    </div>`;
    return;
  }

  // agrupa por dia, mais recente primeiro — dentro do dia, entrada antes de saída
  const porDia = {};
  r.lancamentos.forEach(f=>{ (porDia[f.data] = porDia[f.data] || []).push(f); });

  box.innerHTML = Object.keys(porDia).sort().reverse().map(dia=>{
    const doDia = porDia[dia].slice().sort((a,b)=> (a.tipo==="Entrada"?0:1) - (b.tipo==="Entrada"?0:1));
    // só o que se moveu de verdade: conta a receber não mexeu no caixa
    const liquido = doDia.filter(f=>f.liquidado)
      .reduce((s,f)=> s + (f.tipo==="Entrada"? Number(f.valor)||0 : -(Number(f.valor)||0)), 0);
    const temPendente = doDia.some(f=>!f.liquidado);

      ${doDia.map(f=>`
        <div class="card" style="cursor:pointer" data-edit="${f.id}">

              ${f.liquidado?"":`<span class="badge ${f.vencimento && f.vencimento<todayISO() ? "critical":"warn"}">${f.tipo==="Entrada"?"a receber":"a pagar"}</span>`}
            </div>
          </div>
          <div class="card-meta">
            <span>${esc(f.formaPagamento||"—")}</span>
            ${f.liquidado && f.liquidadoEm && f.liquidadoEm!==f.data ? `<span>recebido em ${fmtDate(f.liquidadoEm)}</span>` : ""}
          </div>
        </div>
      `).join("")}`;
  }).join("");

  box.querySelectorAll("[data-edit]").forEach(el=> el.addEventListener("click", ()=> openFinanceiroForm(db.financeiro.find(x=>x.id===el.dataset.edit))));
}

function renderBackup(c){

  c.innerHTML = `
    <div class="backup-summary">
      <div class="row"><span>Clientes</span><span class="tnum">${db.clientes.length}</span></div>
      <div class="row"><span>Pedidos</span><span class="tnum">${db.pedidos.length}</span></div>

      <div class="row"><span>Tamanho dos dados</span><span class="tnum">${sizeKB} KB</span></div>
    </div>
    <button class="btn primary" style="width:100%;margin-bottom:10px" id="export-btn">Exportar backup</button>
    <label class="btn ghost" style="width:100%;display:block;text-align:center;margin-bottom:24px" for="import-file">Importar backup</label>
    <input type="file" id="import-file" accept="application/json" style="display:none">
    <div class="section-label">Zona de risco</div>
    <button class="btn danger" style="width:100%" id="clear-btn">Apagar todos os dados</button>
  `;
  c.querySelector("#export-btn").addEventListener("click", exportBackup);
  c.querySelector("#import-file").addEventListener("change", importBackup);
  c.querySelector("#clear-btn").addEventListener("click", ()=>{
    if(confirm("Apagar TODOS os dados desse caderno? Não tem como desfazer — exporte um backup antes se não tiver certeza.")){
      db = structuredClone(EMPTY_DB); saveDB(); toast("Dados apagados"); setView("inicio");
    }
  });
}
async function exportBackup(){
  const filename = `gallard-essenza-backup-${todayISO()}.json`;
  const data = JSON.stringify(db, null, 2);
  const downloads = await (window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null));
  if(downloads){
    try{
      await downloads.save({filename, data});
      toast("Backup salvo");
      return;
    }catch(e){ /* segue pro fallback abaixo */ }
  }
  // fallback: link de download comum, caso a capacidade não esteja disponível
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url);
  toast("Backup baixado");
}
function importBackup(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== "object") throw new Error("formato inválido");
      if(!confirm("Importar vai SUBSTITUIR os dados atuais desse caderno pelos do arquivo. Continuar?")) return;
      db = Object.assign(structuredClone(EMPTY_DB), parsed);
      saveDB(); toast("Backup importado"); setView("inicio");
    }catch(e){
      alert("Não consegui ler esse arquivo como backup válido.");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

      if(isEdit) setView("cliente-detalhe", {arg:rec.id});
    });
  });
}

function produtoOptions(selectedId){
  return db.estoque.slice().sort((a,b)=>a.produto.localeCompare(b.produto))
    .map(e=>`<option value="${e.id}" ${e.id===selectedId?"selected":""}>${esc(e.produto)}</option>`).join("");
}

function openPedidoForm(existing){
  if(db.clientes.length===0){ alert("Cadastre um cliente antes de lançar um pedido."); return; }
  if(db.estoque.length===0){
    alert("Cadastre um produto no Estoque antes de lançar um pedido.\n\nO pedido puxa o preço e dá baixa a partir do produto cadastrado — por isso o produto vem primeiro.");
    setView("estoque"); return;
  }
  const isEdit = !!existing;
  const v = existing || {data:todayISO(), formaPagamento:"Pix", status:"Pendente",
                         clienteId: db.clientes[0].id, produtoId: db.estoque[0].id, qtd:1};
  // produto que não existe mais no estoque (excluído depois do pedido)
  const produtoSumiu = isEdit && v.produtoId && !getProduto(v.produtoId);

  openSheet(isEdit?"Editar pedido":"Novo pedido", `
    <div class="field"><label>Cliente</label><select id="f-cliente">${clienteOptions(v.clienteId)}</select></div>
    <div class="field-row">
      <div class="field"><label>Data</label><input id="f-data" type="date" value="${v.data}"></div>
      <div class="field"><label>Status</label><select id="f-status">${["Pendente","Entregue","Cancelado"].map(o=>`<option ${v.status===o?"selected":""}>${o}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Produto</label>
      <select id="f-produto">${produtoOptions(v.produtoId)}</select>
      <div class="hint" id="f-disp" style="margin-top:6px"></div>
    </div>
    ${produtoSumiu?`<p class="hint" style="color:var(--critical)">O produto desse pedido ("${esc(v.produto||"?")}") não está mais no Estoque. Escolha outro acima antes de salvar.</p>`:""}
    <div class="field-row">
      <div class="field"><label>Quantidade</label><input id="f-qtd" type="number" min="1" value="${v.qtd??1}"></div>
      <div class="field"><label>Valor unitário</label><input id="f-valor" type="number" min="0" step="0.01" value="${v.valorUnit??""}"></div>
    </div>
    <div class="field"><label>Valor total</label><div class="computed tnum" id="f-total">${fmtMoney((v.qtd||1)*(v.valorUnit||0))}</div></div>
    <div class="field-row">
      <div class="field"><label>Forma de pagamento</label><select id="f-pag">${["Pix","Dinheiro","Cartão","Boleto"].map(o=>`<option ${v.formaPagamento===o?"selected":""}>${o}</option>`).join("")}</select></div>
      <div class="field"><label>Data de entrega</label><input id="f-entrega" type="date" value="${v.dataEntrega||""}"></div>
    </div>

    <div id="rec-box" style="display:none">
      <div class="field"><label>Recebimento</label>
        <select id="f-recebi">
          <option value="sim" ${v.aPrazo?"":"selected"}>Já recebi</option>
          <option value="nao" ${v.aPrazo?"selected":""}>A receber — combinei pra outro dia</option>
        </select>
      </div>
      <div class="field" id="venc-box" style="display:none">
        <label>Combinado pra receber em</label>
        <input id="f-venc" type="date" value="${v.vencimento||""}">
      </div>
    </div>

    <div class="field"><label>Observações</label><textarea id="f-obs">${esc(v.obs||"")}</textarea></div>
    <p class="hint">Pedido <b>Pendente</b> reserva a quantidade, mas não tira do estoque. Quando vira <b>Entregue</b>, sai do estoque na hora — e o dinheiro só entra no caixa quando você marcar como recebido.</p>
    <div class="btnrow">
      <button class="btn ghost" id="cancel">Cancelar</button>
      <button class="btn primary" id="save">${isEdit?"Salvar":"Lançar pedido"}</button>
    </div>
    ${isEdit?`<button class="btn danger" style="width:100%;margin-top:10px" id="del">Excluir pedido</button>`:""}
  `, root=>{
    const qtdEl = root.querySelector("#f-qtd"), valEl = root.querySelector("#f-valor"),
          totEl = root.querySelector("#f-total"), prodEl = root.querySelector("#f-produto"),
          dispEl = root.querySelector("#f-disp"), statusEl = root.querySelector("#f-status");

    function recalc(){ totEl.textContent = fmtMoney((Number(qtdEl.value)||0)*(Number(valEl.value)||0)); }

    /* Mostra o que sobra de verdade, já descontando o que outros pedidos
       pendentes prometeram — e avisa quando a quantidade pedida não cabe. */
    function atualizaDisponivel(){
      const e = getProduto(prodEl.value);
      if(!e){ dispEl.textContent = ""; return; }
      const prom = comprometido(e.id, isEdit?v.id:null);
      const disp = disponivel(e.id, isEdit?v.id:null);
      const pedida = Number(qtdEl.value)||0;
      const falta = pedida - disp;
      const un = esc(e.unidade||"un");
      dispEl.innerHTML = falta > 0
        ? `<span style="color:var(--critical)">Só ${disp} ${un} disponível — faltam ${falta}. Dá pra salvar assim mesmo, mas o estoque fica negativo.</span>`
        : prom
          ? `${disp} ${un} disponível — ${e.qtd} em estoque, ${prom} já prometido em outro pedido`
          : `${disp} ${un} em estoque`;
    }

    /* Preço novo puxa do cadastro do produto. Ao editar, respeita o preço
       que já estava salvo — pode ter sido um desconto combinado. */
    function preencheValorDoProduto(){
      const e = getProduto(prodEl.value);
      if(e) valEl.value = Number(e.precoVenda)||0;
      recalc(); atualizaDisponivel();
    }
    if(!isEdit) preencheValorDoProduto(); else atualizaDisponivel();

    /* O bloco de recebimento só aparece quando o pedido está Entregue —
       antes disso não há o que receber. E o campo de data só quando ela
       escolhe "a receber". */
    const recBox = root.querySelector("#rec-box"), recEl = root.querySelector("#f-recebi"),
          vencBox = root.querySelector("#venc-box"), vencEl = root.querySelector("#f-venc");
    function toggleRecebimento(){
      recBox.style.display = statusEl.value==="Entregue" ? "block" : "none";
      const aPrazo = recEl.value==="nao";
      vencBox.style.display = (statusEl.value==="Entregue" && aPrazo) ? "block" : "none";
      // sugere uma data em vez de deixar em branco: o caso comum é
      // combinar pra alguns dias depois da entrega
      if(aPrazo && !vencEl.value){
        const base = root.querySelector("#f-entrega").value || root.querySelector("#f-data").value || todayISO();
        const d = new Date(base+"T00:00:00");
        d.setDate(d.getDate()+7);
        vencEl.value = d.toISOString().slice(0,10);
      }
    }
    recEl.addEventListener("change", toggleRecebimento);
    toggleRecebimento();

    prodEl.addEventListener("change", preencheValorDoProduto);
    qtdEl.addEventListener("input", ()=>{ recalc(); atualizaDisponivel(); });
    valEl.addEventListener("input", recalc);
    statusEl.addEventListener("change", ()=>{ atualizaDisponivel(); toggleRecebimento(); });

    root.querySelector("#cancel").addEventListener("click", closeSheet);
    if(isEdit) root.querySelector("#del").addEventListener("click", ()=>{
      if(confirm("Excluir esse pedido?\n\nO lançamento no Financeiro sai junto, e se o pedido já tinha dado baixa, a quantidade volta pro estoque.")){
        reconciliarEstoquePedido(existing, null);
        db.financeiro = db.financeiro.filter(f=>f.pedidoId!==existing.id);
        db.pedidos = db.pedidos.filter(p=>p.id!==existing.id);
        saveDB(); closeSheet(); toast("Pedido excluído"); setView("pedidos");
      }
    });
    root.querySelector("#save").addEventListener("click", ()=>{
      const prod = getProduto(prodEl.value);
      if(!prod){ alert("Escolha um produto do estoque."); return; }
      const rec = {
        id: existing?existing.id:uid(),
        clienteId: root.querySelector("#f-cliente").value,
        data: root.querySelector("#f-data").value || todayISO(),
        produtoId: prod.id,
        produto: prod.produto,               // nome guardado junto, pro histórico
        custoUnit: Number(prod.custoUnit)||0, // custo do dia da venda, pra margem
        qtd: Number(qtdEl.value)||1,
        valorUnit: Number(valEl.value)||0,
        formaPagamento: root.querySelector("#f-pag").value,
        status: statusEl.value,
        dataEntrega: root.querySelector("#f-entrega").value,
        obs: root.querySelector("#f-obs").value.trim(),
        estoqueBaixado: false, qtdBaixada: 0,
        aPrazo: statusEl.value==="Entregue" && recEl.value==="nao",
        vencimento: (statusEl.value==="Entregue" && recEl.value==="nao") ? (vencEl.value || null) : null,
      };

      // devolve a baixa antiga e aplica a nova — cobre troca de produto,
      // mudança de quantidade e ida/volta entre Pendente e Entregue
      reconciliarEstoquePedido(existing || null, rec);

      if(isEdit){ db.pedidos = db.pedidos.map(p=>p.id===rec.id?rec:p); }
      else{ db.pedidos.push(rec); }

      // lançamento financeiro segue o status: só existe se estiver Entregue.
      // Preserva se já foi marcado como recebido, pra editar o pedido não
      // "desreceber" um dinheiro que já entrou.
      const anteriorFin = db.financeiro.find(f=>f.pedidoId===rec.id);
      // !! obrigatório: sem ele isso vira undefined, e JSON.stringify
      // descarta chave undefined — o campo sumiria do que fica salvo
      const jaRecebido = !!(anteriorFin && anteriorFin.liquidado && rec.aPrazo);
      db.financeiro = db.financeiro.filter(f=>f.pedidoId!==rec.id);
      if(rec.status==="Entregue"){
        const cli = getCliente(rec.clienteId);
        const liquidado = !rec.aPrazo || jaRecebido;
        db.financeiro.push({
          id: anteriorFin ? anteriorFin.id : uid(),
          data: rec.dataEntrega||rec.data, tipo:"Entrada", categoria:"Venda de produto",
          descricao: `${rec.produto} — ${cli?cli.nome:""}`, valor: rec.qtd*rec.valorUnit,
          pedidoId: rec.id, formaPagamento: rec.formaPagamento, obs:"",
          estoqueId: null, qtdEntrada: 0,
          liquidado,
          liquidadoEm: liquidado ? (jaRecebido ? anteriorFin.liquidadoEm : (rec.dataEntrega||rec.data)) : null,
          vencimento: rec.aPrazo ? rec.vencimento : null,
        });
      }
      saveDB(); closeSheet();
      toast(rec.status!=="Entregue" ? (isEdit?"Pedido atualizado":"Pedido lançado")
            : rec.aPrazo && !jaRecebido ? `Entregue — a receber${rec.vencimento?" até "+fmtDate(rec.vencimento):""}`
            : "Pedido entregue — estoque e caixa atualizados");
      render();
    });
  });
}

      const ehCompra = catEl.value==="Compra de estoque";
      const rec = {
        id: existing?existing.id:uid(),
        data: root.querySelector("#f-data").value || todayISO(),
        tipo: tipoEl.value,
        categoria: catEl.value,
        descricao: root.querySelector("#f-desc").value.trim(),
        valor,

        pedidoId: v.pedidoId || null,
        obs: v.obs||"",
        estoqueId: ehCompra ? (root.querySelector("#f-estoque").value || null) : null,
        qtdEntrada: ehCompra ? (Number(root.querySelector("#f-qtdent").value)||0) : 0,
        liquidado: liqEl.value==="sim",
        liquidadoEm: liqEl.value==="sim" ? ((existing && existing.liquidado && existing.liquidadoEm) || root.querySelector("#f-data").value || todayISO()) : null,
        vencimento: liqEl.value==="nao" ? (root.querySelector("#f-venc").value || null) : null,
      };

      reconciliarEstoqueCompra(existing || null, rec);

      if(isEdit){ db.financeiro = db.financeiro.map(f=>f.id===rec.id?rec:f); }
      else{ db.financeiro.push(rec); }
      // lançamento com data de outro mês sumiria da tela; leva a visão junto
      state.finMes = rec.data.slice(0,7);
      saveDB(); closeSheet();
      toast(rec.qtdEntrada>0 ? "Lançado — estoque atualizado" : (isEdit?"Lançamento atualizado":"Lançamento criado"));
      render();
    });
  });
}

/* ---------- FAB por view ---------- */
function renderFab(){
  const old = document.getElementById("fab-btn");
  if(old) old.remove();
  const map = {
    clientes: ()=>openClienteForm(),
    pedidos: ()=>openPedidoForm(),
    followup: ()=>openFollowForm(),
    estoque: ()=>openEstoqueForm(),
    financeiro: ()=>openFinanceiroForm(),
  };
  const action = map[state.view];
  if(!action) return;
  const btn = document.createElement("button");
  btn.className = "fab"; btn.id = "fab-btn"; btn.setAttribute("aria-label","Adicionar");
  btn.innerHTML = ICONS.plus;
  btn.addEventListener("click", action);
  document.body.appendChild(btn);
}

const _origRender = render;
render = function(){ _origRender(); renderFab(); };

render();
</script>

  });
}
</script>
